        .nav-profile-meta{ display:flex; flex-direction:column; gap:2px; line-height:1.1; }
        .nav-profile-name{ font-size: 20px; font-weight: 800; color: var(--text-primary); }
        .nav-profile-count{ font-size: 12px; color: var(--text-secondary); }

        .nav-actions{
            display:flex;
            align-items:center;
            gap: 10px;
            flex: 1 1 auto;
            justify-content: flex-start;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .nav-actions::-webkit-scrollbar{ height:0; width:0; }

        .nav-pill{
            height: 32px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
            display:inline-flex;
            align-items:center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease, transform .18s ease;
        }
        .nav-pill-group{
            display:inline-flex;
            border:1px solid var(--border);
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            overflow:hidden;
            box-shadow: var(--shadow-sm);
        }
        [data-theme="dark"] .nav-pill-group{
            background: rgba(15,23,42,0.55);
        }
        .nav-pill-group .nav-pill{
            border:0 !important;
            border-radius:0 !important;
            background: transparent !important;
            box-shadow:none !important;
        }
        .nav-pill-group .nav-pill + .nav-pill{ border-left:1px solid var(--border); }
        .nav-pill-group .nav-pill:hover{ background: var(--bg-hover) !important; }

        .nav-pill:hover{ background: var(--bg-hover); transform: translateY(-1px); }
        .nav-pill:active{ transform: translateY(0); }
        .nav-pill i{ font-size: 12px; opacity: .9; }
        .nav-pill .count{
            margin-left: 4px;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }
        .nav-pill.active{
            border-color: rgba(37,99,235,.45);
            background: rgba(37,99,235,.08);
        }
        .nav-pill:disabled{
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }
        .nav-sep{
            width: 1px;
            height: 22px;
            background: var(--border);
            flex: 0 0 auto;
            margin: 0 2px;
        }

        /* ===== Выбор плиток (SELECT/OPEN) ===== */
        .site-card.is-selected{
            outline: 2px solid rgba(37,99,235,.55);
            outline-offset: 2px;
        }
        .card-select{
            position:absolute;
            top: 6px;
            left: 6px;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: rgba(255,255,255,.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size: 14px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .card-select i { 
            display: none;
            color: #fff;
        }
        .card-select:hover {
            transform: scale(1.1);
            background: var(--accent-soft);
        }
        .card-select.on{
            border-color: var(--accent);
            background: var(--accent);
        }
        .card-select.on i { 
            display: block; 
        }
        
        /* Show checkbox on all cards in select mode */
        body.select-mode .site-card:not(.add-card):not(.placeholder) .card-select {
            opacity: 1;
            pointer-events: auto;
        }
        
        .nav-panel.collapsed{
            height: 16px; /* компактнее при свернутом состоянии */
        }

        @media (max-width: 860px){
            .nav-profile-name{ font-size: 18px; }
            .nav-profile{ min-width: 160px; }
            .nav-content{ padding: 10px 12px; padding-right: 60px; }
        }


        /* ===== v97: Command Palette + Multi-ops ===== */
        .cmdp-overlay{
            position: fixed; inset: 0; z-index: 99999;
            display: none; align-items: flex-start; justify-content: center;
            padding-top: 8vh;
            background: rgba(0,0,0,.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .cmdp-overlay.show{ display:flex; }
        .cmdp-panel{
            width: min(760px, calc(100vw - 24px));
            border-radius: 18px;
            background: rgba(255,255,255,.86);
            border: 1px solid rgba(0,0,0,.12);
            box-shadow: 0 18px 60px rgba(0,0,0,.25);
            overflow: hidden;
        }
        [data-theme="dark"] .cmdp-panel{
            background: rgba(18,18,20,.86);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 18px 60px rgba(0,0,0,.55);
        }
        .cmdp-top{
            display:flex; align-items:center; gap:10px;
            padding: 14px 14px 10px 14px;
            border-bottom: 1px solid rgba(0,0,0,.08);
        }
        [data-theme="dark"] .cmdp-top{ border-bottom: 1px solid rgba(255,255,255,.10); }
        .cmdp-icon{
            width:34px; height:34px; border-radius: 12px;
            display:flex; align-items:center; justify-content:center;
            background: rgba(37,99,235,.10);
            color: #2563eb;
        }
        [data-theme="dark"] .cmdp-icon{ background: rgba(59,130,246,.15); color:#60a5fa; }
        .cmdp-input{
            flex:1;
            border: 0; outline: 0;
            background: transparent;
            font-size: 15px;
            color: inherit;
        }
        .cmdp-input::placeholder{ color: rgba(0,0,0,.45); }
        [data-theme="dark"] .cmdp-input::placeholder{ color: rgba(255,255,255,.42); }
        .cmdp-hint{
            font-size: 12px;
            color: rgba(0,0,0,.50);
            white-space: nowrap;
        }
        [data-theme="dark"] .cmdp-hint{ color: rgba(255,255,255,.48); }
        .cmdp-list{
            max-height: min(52vh, 560px);
            overflow: auto;
            padding: 6px;
        }
        .cmdp-item{
            display:flex; align-items:center; justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            user-select: none;
        }
        .cmdp-item:hover{ background: rgba(0,0,0,.06); }
        [data-theme="dark"] .cmdp-item:hover{ background: rgba(255,255,255,.08); }
        .cmdp-item.active{ background: rgba(37,99,235,.12); }
        [data-theme="dark"] .cmdp-item.active{ background: rgba(59,130,246,.18); }
        .cmdp-left{ min-width: 0; display:flex; flex-direction:column; gap:3px; }
        .cmdp-title{ font-size: 13px; font-weight: 600; line-height: 1.1; }
        .cmdp-sub{ font-size: 12px; color: rgba(0,0,0,.55); line-height: 1.2; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 560px; }
        [data-theme="dark"] .cmdp-sub{ color: rgba(255,255,255,.50); }
        .cmdp-right{ display:flex; align-items:center; gap:8px; }
        .cmdp-chip{
            font-size: 11px; padding: 4px 8px; border-radius: 999px;
            border: 1px solid rgba(0,0,0,.12);
            color: rgba(0,0,0,.65);
            background: rgba(255,255,255,.4);
        }
        [data-theme="dark"] .cmdp-chip{
            border: 1px solid rgba(255,255,255,.14);
            color: rgba(255,255,255,.60);
            background: rgba(255,255,255,.06);
        }
        .cmdp-kbd{
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 11px;
            padding: 4px 7px;
            border-radius: 10px;
            background: rgba(0,0,0,.06);
            color: rgba(0,0,0,.72);
        }
        [data-theme="dark"] .cmdp-kbd{ background: rgba(255,255,255,.08); color: rgba(255,255,255,.72); }
        .cmdp-empty{
            padding: 22px 14px;
            color: rgba(0,0,0,.55);
            font-size: 13px;
        }
        [data-theme="dark"] .cmdp-empty{ color: rgba(255,255,255,.55); }

        .modal .form-row{ display:flex; gap:10px; flex-wrap: wrap; }
        .modal .form-row .form-input, .modal .form-row .form-select{ flex: 1; min-width: 160px; }
        .form-select{
            width:100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            outline: none;
        }
        .tag-chips{ display:flex; gap:8px; flex-wrap: wrap; margin-top: 10px; }
        .tag-chip{
            font-size: 12px; padding: 6px 10px; border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(37,99,235,.06);
        }


        /* ===== v99: Smart search + highlights ===== */
        .search-box{ position: relative; }
        .search-dd{
            position:absolute;
            top: 38px;
            left: 0;
            right: 0;
            z-index: 50;
            display:none;
            max-height: 360px;
            overflow:auto;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.82);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0,0,0,.14);
            padding: 6px;
        }
        body[data-theme="dark"] .search-dd{
            background: rgba(20,20,20,.78);
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }
        .search-dd.show{ display:block; }
        .search-dd-item{
            display:flex;
            align-items:center;
            gap: 10px;
            padding: 10px 10px;
            border-radius: 12px;
            cursor: pointer;
            user-select:none;
        }
        .search-dd-item:hover{ background: rgba(37,99,235,.10); }
        .search-dd-item.active{ background: rgba(37,99,235,.16); }
        .sdi-ic{
            width: 30px; height: 30px;
            border-radius: 10px;
            display:flex; align-items:center; justify-content:center;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.55);
        }
        body[data-theme="dark"] .sdi-ic{ background: rgba(255,255,255,.06); }
        .sdi-txt{ min-width:0; flex: 1; }
        .sdi-title{
            font-size: 13px;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sdi-sub{
            font-size: 12px;
            opacity: .72;

    <div class="top-bar">
        <button class="btn-icon" id="sidebar-toggle" onclick="toggleSidebar()" title="Проводник"><i class="fas fa-bars"></i></button>
        
        <div class="nav-breadcrumb" id="breadcrumb"></div>
        
        <div class="segment-group" id="seg-profiles"></div>
        <div class="sep" id="sep1"></div>
        <div class="segment-group" id="seg-categories"></div>
        <div class="sep" id="sep2"></div>
        <div class="segment-group" id="seg-groups"></div>
        <button class="btn-icon round" id="search-toggle" onclick="toggleSearchDrawer()" title="Поиск"><i class="fas fa-search"></i></button>
        <button class="btn-icon round" id="settings-toggle" onclick="openSettings()" title="Настройки"><i class="fas fa-cog"></i></button>
    
    </div>
    <div class="search-drawer" id="search-drawer" aria-hidden="true">
      <div class="sd-head">
        <i class="fas fa-search"></i>
        <input id="global-search" type="text" placeholder="Поиск по закладкам или в интернете…" oninput="smartSearch(this.value)" onkeydown="handleSearchKey(event)" autocomplete="off" spellcheck="false">
        <button class="sd-close" onclick="toggleSearchDrawer(false)" title="Закрыть"><i class="fas fa-times"></i></button>
      </div>
      <!-- Web search row -->
      <div class="sd-row" style="border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:6px;">
        <div class="sd-lbl">Искать в</div>
        <select id="search-engine-select" style="flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);font-size:12px;">
          <option value="google">Google</option>
          <option value="yandex">Яндекс</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="bing">Bing</option>
          <option value="perplexity">Perplexity AI</option>
        </select>
        <button class="btn primary" onclick="searchInWeb()" style="padding:6px 12px;font-size:12px;margin-left:8px;"><i class="fas fa-globe" style="margin-right:4px;"></i>Искать</button>
      </div>
      <div class="sd-row">
        <div class="sd-lbl">Браузер</div>
        <div class="sd-slider">
          <span class="sd-mini">Выкл</span>
          <input type="range" min="0" max="1" step="1" value="0" id="browser-slider" oninput="toggleBrowserPicker(this.value)">
          <span class="sd-mini">Вкл</span>
        </div>
        <div class="sd-picker" id="browser-picker"></div>
      </div>
      <div id="smart-search-dd" class="search-dd" aria-label="Результаты поиска"></div>
    </div>

    <div class="main-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>ПРОВОДНИК</span>
                <div class="sidebar-header-actions">
                    <button class="hdr-ic" id="toggle-explorer-btn" title="Развернуть/Свернуть все" onclick="toggleExplorerAll()"><i class="fas fa-chevron-down"></i></button>
                    <button class="hdr-ic" title="Настройки проводника" onclick="openProfileSettings()"><i class="fas fa-cog"></i></button>
                </div>
            </div>
            <div class="sidebar-scroll" id="sidebar-tree"></div>
            <div class="sidebar-footer">
                <button class="sidebar-footer-btn" onclick="openStatisticsModal()"><i class="fas fa-chart-bar"></i><span>Статистика</span></button>
            </div>
        </div>
        <div class="content-area">
            <div class="nav-panel" id="nav-panel">
                <div class="nav-content" id="nav-content">

                    <div class="nav-location" id="nav-location">
                        <div class="nav-location-icon" id="nav-location-icon"><i class="fas fa-home"></i></div>
                        <div class="nav-location-title" id="nav-location-title">Дом</div>
                        <div class="nav-location-count">(<span id="nav-view-count">0</span>)</div>
                    </div>
                    
                    <div class="nav-actions" role="toolbar" aria-label="Настройки и действия">
                        <div class="nav-pill-group" role="group" aria-label="Фильтры">
                            <button class="nav-pill" id="nav-btn-fav" type="button" title="Показать только избранное">
                                <i class="fas fa-star"></i><span>Избранное</span>
                            </button>
                            <button class="nav-pill" id="nav-btn-top" type="button" title="Избранные сверху">
                                <i class="fas fa-arrow-up"></i><span>Сверху</span>
                            </button>
                        </div>
                        <div class="nav-sep" aria-hidden="true"></div>
                        <div class="nav-pill-group" role="group" aria-label="Выбор">
                            <button class="nav-pill" id="nav-btn-select" type="button" title="Режим выбора">
                                <i class="far fa-check-square"></i><span>SELECT</span><span class="count" id="nav-select-count">0</span>
                            </button>
                            <button class="nav-pill" id="nav-btn-open" type="button" title="Открыть выбранные" disabled>
                                <i class="fas fa-external-link-alt"></i><span>OPEN</span><span class="count" id="nav-open-count">0</span>
                            </button>
                        </div>
                        <button class="nav-pill" id="nav-btn-folder" type="button" title="Создать папку (группу)" style="display:none;">
                            <i class="fas fa-folder-plus"></i><span>Папка</span>
                        </button>
                    </div>

                </div>
                <!-- Язычок сворачивания/разворачивания (всегда видим) -->
                <button class="nav-tongue" id="nav-tongue" onclick="toggleNavPanel()" title="Свернуть/развернуть панель" aria-label="Свернуть/развернуть панель">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
            <div class="content-scroll">
                <div id="cards-grid"></div>
            </div>
        </div>
    </div>

    <div id="settings-panel">
        <div class="settings-nav" id="settings-nav"></div>
        <div class="settings-body">
            <div class="settings-header">
                <div class="undo-redo">
                    <button onclick="undo()" id="btn-undo" disabled title="Отменить"><i class="fas fa-undo"></i></button>
                    <button onclick="redo()" id="btn-redo" disabled title="Повторить"><i class="fas fa-redo"></i></button>
                </div>
                <h3 id="settings-title">Настройки</h3>
                <button class="btn-icon" onclick="closeSettings()"><i class="fas fa-times"></i></button>
            </div>
            <div class="settings-scroll" id="settings-content"></div>
        </div>
    </div>

    <div class="ctx-menu" id="ctx-menu"></div>

    <div class="modal" id="site-modal">
        <div class="modal-box" style="max-width:460px;">
            <div class="modal-header"><span id="site-modal-title">Добавить сайт</span><i class="fas fa-times" style="cursor:pointer" onclick="closeModal('site-modal')"></i></div>
            <div class="modal-body">
                <div class="form-group"><label>Название</label><input class="form-input" id="site-name" placeholder="Google"></div>
                <div class="form-group"><label>URL</label><input class="form-input" id="site-url" placeholder="https://google.com"></div>
                <div class="form-group"><label>Описание</label><input class="form-input" id="site-desc" placeholder="Поисковая система"></div>
                <div class="form-group">
                    <label>Цвет фона иконки</label>
                    <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
                        <input type="color" id="site-bg-color" value="#6366f1" style="width:48px;height:36px;border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:2px;">
                        <button class="btn" type="button" onclick="extractColorForCurrentSite()" style="flex:1;font-size:12px;">
                            <i class="fas fa-magic" style="margin-right:6px;"></i>Авто из favicon
                        </button>
                    </div>
                    <div style="font-size:11px;color:var(--text-tertiary);margin-top:6px;">Извлекает доминирующий цвет с краёв иконки сайта</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('site-modal')">Отмена</button>
                <button class="btn primary" onclick="saveSite()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-box">
            <div class="modal-header"><span id="edit-modal-title">Редактировать</span><i class="fas fa-times" style="cursor:pointer" onclick="closeModal('edit-modal')"></i></div>
            <div class="modal-body" id="edit-modal-body"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('edit-modal')">Отмена</button>
                <button class="btn primary" onclick="saveEditItem()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="info-modal">
        <div class="modal-box">
            <div class="modal-header"><span>Информация о сайте</span><i class="fas fa-times" style="cursor:pointer" onclick="closeModal('info-modal')"></i></div>
            <div class="modal-body" id="info-modal-body"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('info-modal')">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="modal" id="upload-modal">
        <div class="modal-box">
            <div class="modal-header"><span>Загрузить обои</span><i class="fas fa-times" style="cursor:pointer" onclick="closeModal('upload-modal')"></i></div>
            <div class="modal-body">
                <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Нажмите или перетащите файл</p>
                    <span>PNG, JPG, WebP до 10MB</span>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="uploadWallpaperFile(event)">
                <div style="text-align:center;color:var(--text-tertiary);font-size:12px;margin-bottom:16px">или</div>
                <div class="url-input-group">
                    <input class="form-input" id="wp-url" placeholder="https://example.com/image.jpg">
                    <button class="btn primary" onclick="uploadWallpaperUrl()">Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Statistics Modal -->
    <div class="modal" id="statistics-modal">
        <div class="modal-box" style="max-width: 900px;">
            <div class="modal-header">
                <span><i class="fas fa-chart-bar" style="margin-right:8px;color:var(--accent)"></i>Статистика</span>
                <i class="fas fa-times" style="cursor:pointer" onclick="closeModal('statistics-modal')"></i>
            </div>
            <div class="modal-body" id="statistics-modal-body">
                <!-- Заполняется динамически -->
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('statistics-modal')">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

function _collectHoverIds() {
  const ids = new Set();
  Object.values(HOVER_EFFECTS || {}).forEach(arr => (arr || []).forEach(e => ids.add(e.id)));
  return ids;
}
function _collectHoverCats() {
  const map = new Map(); // id -> cat
  Object.entries(HOVER_EFFECTS || {}).forEach(([cat, arr]) => (arr || []).forEach(e => map.set(e.id, cat)));
  return map;
}
function _collectWallpaperCats() {
  const map = new Map(); // value -> cat
  Object.entries(WALLPAPER_CATS || {}).forEach(([cat, arr]) => (arr || []).forEach(v => map.set(v, cat)));
  return map;
}

const _HOVER_ID_SET = _collectHoverIds();
const _HOVER_CAT_MAP = _collectHoverCats();
const _WALLPAPER_CAT_MAP = _collectWallpaperCats();

function findHoverCategory(hoverId) {
  return _HOVER_CAT_MAP.get(String(hoverId || '').trim()) || null;

function sanitizeFX() {
  if (!FX || typeof FX !== 'object') FX = JSON.parse(JSON.stringify(DEFAULT_FX));

  // legacy mapping
  if (LEGACY_FX_MAP.mode[FX.mode]) FX.mode = LEGACY_FX_MAP.mode[FX.mode];
  if (LEGACY_FX_MAP.iconStyle[FX.iconStyle]) FX.iconStyle = LEGACY_FX_MAP.iconStyle[FX.iconStyle];
  if (LEGACY_FX_MAP.topbarStyle[FX.topbarStyle]) FX.topbarStyle = LEGACY_FX_MAP.topbarStyle[FX.topbarStyle];

  // v113: Миграция старых mode в cardLayout (ios оставляем как mode)
  const modeToCardLayout = { 'minimal': 'minimal', 'glass': 'glass', 'poster': 'poster' };
  if (modeToCardLayout[FX.mode]) {
    FX.cardLayout = modeToCardLayout[FX.mode];
    FX.mode = 'icon';
  }

  // allowed enums - добавляем screenshot
  const allowedModes = new Set(['icon','list','finder','preview','ios','screenshot']);
  if (!allowedModes.has(FX.mode)) FX.mode = DEFAULT_FX.mode;

  const allowedTheme = new Set(['light','dark']);
  if (!allowedTheme.has(FX.theme)) FX.theme = DEFAULT_FX.theme;

  const allowedTopbar = new Set(['breadcrumb','classic']);
  if (!allowedTopbar.has(FX.topbarStyle)) FX.topbarStyle = DEFAULT_FX.topbarStyle;

  const allowedCardShadow = new Set(['none','subtle','soft','medium','strong','float']);
  if (!allowedCardShadow.has(FX.cardShadow)) FX.cardShadow = DEFAULT_FX.cardShadow;

  const allowedCardActions = new Set(['off','hover','always']);
  if (!allowedCardActions.has(FX.cardActions)) FX.cardActions = DEFAULT_FX.cardActions;

  const allowedCardLayout = new Set(['default','v31cards','minimal','glass','poster','ios']);
  if (!allowedCardLayout.has(FX.cardLayout)) FX.cardLayout = DEFAULT_FX.cardLayout;

  const iconStyleIds = new Set((ICON_STYLES || []).map(s => s.id));
  if (!iconStyleIds.has(FX.iconStyle)) FX.iconStyle = DEFAULT_FX.iconStyle;

  // hover/press validation
  if (!_HOVER_ID_SET.has(FX.hover)) FX.hover = DEFAULT_FX.hover;
  const pressIds = new Set((PRESS_EFFECTS || []).map(e => e.id));
  if (!pressIds.has(FX.press)) FX.press = DEFAULT_FX.press;

  // numeric coercion + bounds (prevents "not highlighted" due to string numbers)
  const num = (k, def, min, max) => {
    let v = Number(FX[k]);
    if (!Number.isFinite(v)) v = def;
    if (typeof min === 'number') v = Math.max(min, v);
    if (typeof max === 'number') v = Math.min(max, v);
    FX[k] = v;
  };

  num('cardWidth', DEFAULT_FX.cardWidth, 120, 420);
  num('cardHeight', DEFAULT_FX.cardHeight, 90, 360);
  num('cardRadius', DEFAULT_FX.cardRadius, 0, 32);
  num('cardBorder', DEFAULT_FX.cardBorder, 0, 6);
  num('cardPadding', DEFAULT_FX.cardPadding, 0, 40);
  num('cardScale', DEFAULT_FX.cardScale, 60, 140);

  num('gridCols', DEFAULT_FX.gridCols, 2, 12);
  num('gridGap', DEFAULT_FX.gridGap, 4, 60);

  num('iconSize', DEFAULT_FX.iconSize, 24, 100);
  num('iconBgSize', DEFAULT_FX.iconBgSize, 28, 140);
  num('iconRadius', DEFAULT_FX.iconRadius, 0, 28);
  num('iconEffectStrength', DEFAULT_FX.iconEffectStrength, 0, 200);

  num('fontSize', DEFAULT_FX.fontSize, 10, 20);
  num('fontWeight', DEFAULT_FX.fontWeight, 300, 800);

  num('hoverStrength', DEFAULT_FX.hoverStrength, 0, 200);
  num('bgOpacity', DEFAULT_FX.bgOpacity, 0, 100);
  num('bgBlur', DEFAULT_FX.bgBlur, 0, 30);

  // Миграция showTitle/showDesc в textMode
  if (FX.showTitle === false) {
    FX.textMode = 'none';
  } else if (FX.showDesc === true) {
    FX.textMode = 'full';
  }
  delete FX.showTitle;
  delete FX.showDesc;
  
  // Валидация textMode
  const allowedTextMode = new Set(['none', 'title', 'full']);
  if (!allowedTextMode.has(FX.textMode)) FX.textMode = DEFAULT_FX.textMode;

  if (!Array.isArray(FX.customWallpapers)) FX.customWallpapers = [];

  return FX;
}

}

function snapshotState() {
    // minimal UI state that matters for navigation/filters
    return {
        profileId: state.profileId,
        categoryId: state.categoryId,
        groupId: state.groupId,
        starOnly: !!state.starOnly,
        starTop: !!state.starTop,
        openProfiles: state.openProfiles || {}
    };
}

function applySnapshot(obj){
    // guard against missing keys
    FX = { ...DEFAULT_FX, ...(obj.fx || obj.FX || {}) };
    DATA = { ...DEFAULT_DATA, ...(obj.data || obj.DATA || {}) };

    const st = obj.state || obj.ui || {};
    state.profileId = st.profileId ?? state.profileId;
    state.categoryId = st.categoryId ?? state.categoryId;
    state.groupId = st.groupId ?? state.groupId;
    state.starOnly = !!st.starOnly;
    state.starTop = !!st.starTop;
    state.openProfiles = st.openProfiles || state.openProfiles || {};

    // selection should not be resurrected from history
    state.selectedIds = [];
    state.selectMode = false;

    // persist
    saveData();
    applyCSS();
    render();
    renderSettings();
    updateSelectFloat();
}

function loadHistoryLog(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY + '_history_log');
        if (raw) actionLog = JSON.parse(raw) || [];
    }catch(e){}
    if (!Array.isArray(actionLog)) actionLog = [];
}

function clearHistoryLog(){
    if(!confirm('Очистить журнал действий?')) return;
    actionLog = [];
    saveHistoryLog();
    if (activeSection === 'history') renderSettings();
    showToast('Журнал очищен');
}

function saveHistoryLog(){
    try{
        localStorage.setItem(STORAGE_KEY + '_history_log', JSON.stringify(actionLog.slice(-MAX_LOG)));
    }catch(e){}
}

function pushHistory(opts = {}) {
    if (__RESTORING_HISTORY) return;

    const type = opts.type || 'fx'; // 'fx' | 'data'
    const label = opts.label || (type === 'data' ? 'Изменение данных' : 'Изменение оформления');
    const silent = (opts.silent !== undefined) ? !!opts.silent : (type === 'fx');

    const snapObj = { fx: FX, data: DATA, state: snapshotState() };
    const snap = JSON.stringify(snapObj);

    if (historyIndex >= 0 && history[historyIndex]?.snap === snap) return;

    history = history.slice(0, historyIndex + 1);
    history.push({ snap, label, type, ts: Date.now() });

    if (history.length > MAX_HISTORY) history.shift();
    historyIndex = history.length - 1;

    if (!silent) {
        actionLog.push({ ts: Date.now(), label, type });
        if (actionLog.length > MAX_LOG) actionLog = actionLog.slice(-MAX_LOG);
        saveHistoryLog();
    }

    updateUndoRedo();
    if (activeSection === 'history') renderSettings();
}

function initHistory() {
    loadHistoryLog();
    // initial snapshot
    pushHistory({ type: 'data', label: 'Старт', silent: true });
}

function undo() {
    if (historyIndex <= 0) return;
    historyIndex--;
    __RESTORING_HISTORY = true;
    try {
        const obj = JSON.parse(history[historyIndex].snap);
        applySnapshot(obj);
    } catch (e) {
        console.error(e);
    } finally {
        __RESTORING_HISTORY = false;
        updateUndoRedo();
    }
}

function redo() {
    if (historyIndex >= history.length - 1) return;
    historyIndex++;
    __RESTORING_HISTORY = true;
    try {
        const obj = JSON.parse(history[historyIndex].snap);
        applySnapshot(obj);
    } catch (e) {
        console.error(e);
    } finally {
        __RESTORING_HISTORY = false;
        updateUndoRedo();
    }
}

function updateUndoRedo() {
    const u = document.getElementById('btn-undo');
    const r = document.getElementById('btn-redo');
    if (u) u.disabled = historyIndex <= 0;
    if (r) r.disabled = historyIndex >= history.length - 1;
}

            actionLog.push({ ts: Date.now(), label: 'Ошибка: ' + msg, type: 'error' });
            if (actionLog.length > MAX_LOG) actionLog = actionLog.slice(-MAX_LOG);
            saveHistoryLog();
            showToast('Ошибка в скрипте — открой Историю', 3500);
            updateUndoRedo();
        } catch (_) {}
    });

    window.addEventListener('unhandledrejection', (ev) => {
        try {
            const msg = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Promise rejection';
            actionLog.push({ ts: Date.now(), label: 'Ошибка: ' + msg, type: 'error' });
            if (actionLog.length > MAX_LOG) actionLog = actionLog.slice(-MAX_LOG);
            saveHistoryLog();
            showToast('Ошибка в скрипте — открой Историю', 3500);
            updateUndoRedo();
        } catch (_) {}
    });
}

function migrateData(stored){
    // Robust migration for older/incorrect schemas in localStorage.
    const out = JSON.parse(JSON.stringify(DEFAULT_DATA));

    const arr = (v) => Array.isArray(v) ? v : null;

    // Copy known arrays if valid
    if (arr(stored?.profiles)) out.profiles = stored.profiles;
    if (arr(stored?.categories)) out.categories = stored.categories;
    if (arr(stored?.groups)) out.groups = stored.groups;
    if (arr(stored?.sites)) out.sites = stored.sites;

    // Legacy keys (best-effort)
    if (!arr(stored?.sites) && arr(stored?.tiles)) {
        out.sites = stored.tiles.map((t, i) => ({
            id: Number(t.id ?? (i + 1)),
            categoryId: Number(t.categoryId ?? t.catId ?? 1),
            groupId: (t.groupId ?? t.subgroupId ?? null) === null ? null : Number(t.groupId ?? t.subgroupId),
            name: String(t.name ?? t.title ?? 'Сайт'),
            url: String(t.url ?? ''),
            desc: String(t.desc ?? t.description ?? ''),
            icon: String(t.icon ?? t.iconClass ?? ''),
            bg: String(t.bg ?? t.color ?? ''),
            starred: !!(t.starred ?? t.favorite ?? false)
        }));
    }

    // Objects/maps
    if (stored?.collapsedGroups && typeof stored.collapsedGroups === 'object') out.collapsedGroups = stored.collapsedGroups;

    // Sanity: ensure arrays exist
    if (!Array.isArray(out.profiles)) out.profiles = [];
    if (!Array.isArray(out.categories)) out.categories = [];
    if (!Array.isArray(out.groups)) out.groups = [];
    if (!Array.isArray(out.sites)) out.sites = [];

    // Fix missing ids
    const ensureIds = (a) => {
        let max = 0;
        a.forEach(x => { const n = Number(x?.id); if (Number.isFinite(n)) max = Math.max(max, n); });
        a.forEach((x, idx) => { if (!Number.isFinite(Number(x?.id))) x.id = ++max; });
    };
    ensureIds(out.profiles);
    ensureIds(out.categories);
    ensureIds(out.groups);
    ensureIds(out.sites);

    // Ensure profileId/categoryId references are not null where required
    if (!out.profiles.length) out.profiles = JSON.parse(JSON.stringify(DEFAULT_DATA.profiles));
    if (!out.categories.length) out.categories = JSON.parse(JSON.stringify(DEFAULT_DATA.categories));
    if (!out.groups.length) out.groups = JSON.parse(JSON.stringify(DEFAULT_DATA.groups));

    // If sites exist but categoryId missing, attach to first category of first profile
    const fallbackProfileId = out.profiles[0]?.id ?? 1;
    const fallbackCatId = (out.categories.find(c => c.profileId === fallbackProfileId)?.id) ?? (out.categories[0]?.id ?? 1);

    out.sites.forEach(s => {
        if (!Number.isFinite(Number(s.categoryId))) s.categoryId = fallbackCatId;
        if (s.groupId !== null && !Number.isFinite(Number(s.groupId))) s.groupId = null;
        if (typeof s.url !== 'string') s.url = String(s.url ?? '');
        if (typeof s.name !== 'string') s.name = String(s.name ?? 'Сайт');
        if (typeof s.desc !== 'string') s.desc = String(s.desc ?? '');
        if (typeof s.icon !== 'string') s.icon = String(s.icon ?? '');
        if (typeof s.bg !== 'string') s.bg = String(s.bg ?? '');
    });

    return out;
}

function calcMaxCols() {

// ===== DATA INTEGRITY (v105+) =====
function fixDataLinks() {
    try {
        if (!DATA) return;
        if (!Array.isArray(DATA.profiles)) DATA.profiles = [];
        if (!Array.isArray(DATA.categories)) DATA.categories = [];
        if (!Array.isArray(DATA.groups)) DATA.groups = [];
        if (!Array.isArray(DATA.sites)) DATA.sites = [];

        const profIds = new Set(DATA.profiles.map(p=>p.id));
        if (DATA.profiles.length === 0) {
            DATA.profiles.push({id:1,name:'Профиль',icon:'fa-home'});
            profIds.add(1);
        }
        DATA.categories.forEach(c => { if (!profIds.has(c.profileId)) c.profileId = DATA.profiles[0].id; });

        const catIds = new Set(DATA.categories.map(c=>c.id));
        if (DATA.categories.length === 0) {
            const pid = DATA.profiles[0].id;
            DATA.categories.push({id:1,profileId:pid,name:'Категория',icon:'fa-folder'});
            catIds.add(1);
        }
        DATA.groups.forEach(g => { if (!catIds.has(g.categoryId)) g.categoryId = DATA.categories[0].id; });

        const grpIds = new Set(DATA.groups.map(g=>g.id));

        DATA.sites.forEach(s => {
            // infer category from group if needed
            if (!catIds.has(s.categoryId)) {
                if (s.groupId && grpIds.has(s.groupId)) {
                    const g = DATA.groups.find(x=>x.id===s.groupId);
                    s.categoryId = g ? g.categoryId : DATA.categories[0].id;
                } else {
                    s.categoryId = DATA.categories[0].id;
                }
            }
            if (s.groupId && !grpIds.has(s.groupId)) s.groupId = null;
        });

        // state sanity
        if (state && state.profileId && !profIds.has(state.profileId)) state.profileId = DATA.profiles[0].id;
        if (state && state.categoryId && !catIds.has(state.categoryId)) state.categoryId = null;
        if (state && state.groupId && !grpIds.has(state.groupId)) state.groupId = null;

    } catch (e) {
        console.warn('fixDataLinks failed', e);
    }
}

let __breadJustOpened = false;
let __breadOpenTime = 0;
let __breadClickTarget = null;

function toggleBread(el, type, ev) { 
    const e = ev || window.event; 
    if (e) { 
        e.stopPropagation(); 
        e.preventDefault();
    }
    
    // Mark that we're handling a bread click
    __breadClickTarget = el;
    __breadJustOpened = true;
    __breadOpenTime = Date.now();
    
    const wasOpen = el.classList.contains('open'); 
    
    // Close all other dropdowns first
    document.querySelectorAll('.bread-item.open').forEach(item => {
        if (item !== el) item.classList.remove('open');
    });
    
    // Toggle current
    if (!wasOpen) {
        el.classList.add('open');
    } else {
        el.classList.remove('open');
    }
    
    // Clear protection after delay
    setTimeout(() => { 
        __breadJustOpened = false; 
        __breadClickTarget = null;
    }, 300);
}

function closeBreadDropdowns(force) { 
    // Don't close if just opened (within 300ms) unless forced
    if (!force) {
        if (__breadJustOpened) return;
        if (Date.now() - __breadOpenTime < 300) return;
    }
    document.querySelectorAll('.bread-item.open').forEach(el => el.classList.remove('open')); 
}

// Setup breadcrumb close on outside click (called once after DOM ready)
function setupBreadcrumbListeners() {
    document.addEventListener('click', e => {
        // If clicking inside bread-item, let toggleBread handle it
        if (e.target.closest('.bread-item')) return;
        // If just opened, don't close
        if (__breadJustOpened) return;
        if (Date.now() - __breadOpenTime < 300) return;
        // Close all dropdowns
        closeBreadDropdowns(true);
    });
}
function selectProfileBread(id) { state.profileId = id; state.categoryId = null; state.groupId = null; closeBreadDropdowns(true); render(); }
function selectCategoryBread(id) { const cat = DATA.categories.find(c => c.id === id); if (cat) { state.profileId = cat.profileId; state.categoryId = id; state.groupId = null; } closeBreadDropdowns(true); render(); }
function selectGroupBread(id) { const grp = DATA.groups.find(g => g.id === id); if (grp) { const cat = DATA.categories.find(c => c.id === grp.categoryId); if (cat) { state.profileId = cat.profileId; state.categoryId = grp.categoryId; state.groupId = id; } } closeBreadDropdowns(true); render(); }
function clearCategoryBread() { state.categoryId = null; state.groupId = null; closeBreadDropdowns(true); render(); }
function clearGroupBread() { state.groupId = null; closeBreadDropdowns(true); render(); }

function normalizeUrl(u){
  if(!u) return '';
  const s = String(u).trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://' + s;
}
function getSiteIconHTML(site){
  // Priority: explicit icon -> favicon(host) -> letter/globe
  const icon = (site.icon||'').trim();
  if(icon){
    // allow 'fab fa-youtube' etc
    if(icon.includes('fa-')) return `<i class="${escapeHtml(icon)}"></i>`;
  }
  const url = normalizeUrl(site.url);
  try{
    const host = new URL(url).hostname;
    if(host){
      const fav = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
      return `<img src="${fav}" alt="">`;
    }
  }catch(e){}
  const name = (site.name||'').trim();
  const letter = name ? name[0].toUpperCase() : '🌐';
  return `<span class="fallback-letter">${escapeHtml(letter)}</span>`;
}

function showSitePreview(site, x, y){
    const tip = document.getElementById('site-preview-tip'); if(!tip) return;
    tip.style.display = 'block';
    const maxW = 280;
    const pad = 12;
    let left = x + 18;
    let top = y + 18;
    if (left + maxW + pad > window.innerWidth) left = x - maxW - 18;
    if (top + 260 > window.innerHeight) top = y - 260;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    const domain = (()=>{ try{ return new URL(site.url).hostname; }catch(_){ return ''; }})();
    tip.innerHTML = `
      <div class="ph">PREVIEW</div>
      <div class="pt">${escapeHtml(site.name)}</div>
      <div class="pu">${escapeHtml(site.url)}</div>
      <div class="pd">${escapeHtml(site.desc||'')}</div>
    `;
}

function exportProfileJSON(profileId){
    const p = DATA.profiles.find(x=>x.id===profileId); if(!p) return;
    const cats = DATA.categories.filter(c=>c.profileId===profileId);
    const catIds = new Set(cats.map(c=>c.id));
    const grps = DATA.groups.filter(g=>catIds.has(g.categoryId));
    const grpIds = new Set(grps.map(g=>g.id));
    const sites = DATA.sites.filter(s=>catIds.has(s.categoryId) || (s.groupId && grpIds.has(s.groupId)));
    const payload = { profile: p, categories: cats, groups: grps, sites: sites };
    downloadText(JSON.stringify(payload, null, 2), `profile_${profileId}_${(p.name||'profile').replace(/\s+/g,'_')}.json`);
}

function downloadText(text, filename){
    const blob = new Blob([text], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

function importProfileFile(profileId, file){
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
        try{
            const obj = JSON.parse(String(r.result||'{}'));
            applyProfileImport(profileId, obj, 'merge');
            toast('Импортировано');
            renderProfileSettings();
        }catch(e){ toast('Ошибка импорта'); }
    };
    r.readAsText(file);
}
function importProfileFromTextarea(profileId, mode){
    const ta = document.getElementById('ps-import-ta');
    if (!ta) return;
    let obj;
    try { obj = JSON.parse(ta.value); } catch(e){ return toast('JSON некорректный'); }
    applyProfileImport(profileId, obj, mode);
    toast('Импорт применён');
    renderProfileSettings();
}
function applyProfileImport(profileId, obj, mode){
    if (!obj) return;
    const incomingProfile = obj.profile;
    const incomingCats = Array.isArray(obj.categories)?obj.categories:[];
    const incomingGroups = Array.isArray(obj.groups)?obj.groups:[];
    const incomingSites = Array.isArray(obj.sites)?obj.sites:[];

    if (mode === 'new') {
        const newId = nextId(DATA.profiles);
        const p = {...incomingProfile, id:newId, name: (incomingProfile?.name||'Профиль') + ' (импорт)'};
        DATA.profiles.push(p);
        // remap ids for cats/groups/sites
        const catMap = new Map();
        incomingCats.forEach(c=>{ const id=nextId(DATA.categories); catMap.set(c.id,id); DATA.categories.push({...c, id, profileId:newId}); });
        const grpMap = new Map();
        incomingGroups.forEach(g=>{ const id=nextId(DATA.groups); grpMap.set(g.id,id); DATA.groups.push({...g, id, categoryId: catMap.get(g.categoryId) ?? (DATA.categories.find(c=>c.profileId===newId)?.id)}); });
        incomingSites.forEach(s=>{ DATA.sites.push({...s, id: nextId(DATA.sites), categoryId: catMap.get(s.categoryId) ?? (DATA.categories.find(c=>c.profileId===newId)?.id), groupId: s.groupId? (grpMap.get(s.groupId)??null):null}); });
        saveData(); fixDataLinks(); renderSidebar(); renderSegments(); renderBreadcrumb(); renderContent();
        return;
    }

    // target profile
    const targetProfile = DATA.profiles.find(p=>p.id===profileId);
    if (!targetProfile) return;

    if (mode === 'replace') {
        // remove existing cats/groups/sites under profile
        const cats = DATA.categories.filter(c=>c.profileId===profileId);
        const catIds = new Set(cats.map(c=>c.id));
        const grpIds = new Set(DATA.groups.filter(g=>catIds.has(g.categoryId)).map(g=>g.id));
        DATA.sites = DATA.sites.filter(s=>!(catIds.has(s.categoryId) || (s.groupId && grpIds.has(s.groupId))));
        DATA.groups = DATA.groups.filter(g=>!catIds.has(g.categoryId));
        DATA.categories = DATA.categories.filter(c=>c.profileId!==profileId);
    }

    // merge: add categories/groups/sites with new ids
    const catMap = new Map();
    incomingCats.forEach(c=>{ const id=nextId(DATA.categories); catMap.set(c.id,id); DATA.categories.push({...c, id, profileId:profileId}); });
    const grpMap = new Map();
    incomingGroups.forEach(g=>{ const id=nextId(DATA.groups); grpMap.set(g.id,id); DATA.groups.push({...g, id, categoryId: catMap.get(g.categoryId) ?? (DATA.categories.find(c=>c.profileId===profileId)?.id)}); });
    incomingSites.forEach(s=>{ DATA.sites.push({...s, id: nextId(DATA.sites), categoryId: catMap.get(s.categoryId) ?? (DATA.categories.find(c=>c.profileId===profileId)?.id), groupId: s.groupId? (grpMap.get(s.groupId)??null):null}); });

    saveData(); fixDataLinks(); renderSidebar(); renderSegments(); renderBreadcrumb(); renderContent();
}

function nextId(arr){
    const max = (arr||[]).reduce((m,o)=>Math.max(m, Number(o.id)||0), 0);
    return max + 1;
}

function renderContent() {
    let sites = Array.isArray(DATA.sites) ? DATA.sites : [];
    let title = 'Все закладки', icon = 'fa-globe';

    if (state.search) { const q = state.search.toLowerCase(); sites = sites.filter(s => s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q)); title = `Поиск: "${state.search}"`; icon = 'fa-search'; }
    else if (state.groupId) {
        const selGroup = DATA.groups.find(g=>g.id===state.groupId);
        if(selGroup && selGroup.isFolder){
            const childIds = DATA.groups.filter(x=>x.parentFolderId===selGroup.id).map(x=>x.id);
            sites = sites.filter(s => childIds.includes(s.groupId));
        } else {
 sites = sites.filter(s => s.groupId === state.groupId);
        }
 const g = DATA.groups.find(x => x.id === state.groupId); title = g?.name || 'Группа'; icon = g?.icon || 'fa-folder'; }
    else if (state.categoryId) { sites = sites.filter(s => s.categoryId === state.categoryId); const c = DATA.categories.find(x => x.id === state.categoryId); title = c?.name || 'Категория'; icon = c?.icon || 'fa-folder'; }
    else if (state.profileId) { const catIds = DATA.categories.filter(c => c.profileId === state.profileId).map(c => c.id); sites = sites.filter(s => catIds.includes(s.categoryId)); const p = DATA.profiles.find(x => x.id === state.profileId); title = p?.name || 'Профиль'; icon = p?.icon || 'fa-home'; }


    // Фильтры панели: Избранное / Сверху
    if (state.starOnly) sites = sites.filter(s => !!s.starred);
    if (state.starTop) {
        const __pos = new Map();
        sites.forEach((s, i) => __pos.set(s.id, i));
        sites = sites.slice().sort((a, b) => {
            const da = a.starred ? 1 : 0;
            const db = b.starred ? 1 : 0;
            if (db !== da) return db - da;
            return (__pos.get(a.id) ?? 0) - (__pos.get(b.id) ?? 0);
        });
    }

    // Текущее отображение (для счётчиков/массовых действий)
    window.__currentViewSites = sites;
    updateMiniNavPanel(sites.length);

    // Совместимость: если где-то остался page-title, обновляем и его
    const __pt = document.getElementById('page-title');
    if (__pt) __pt.innerHTML = `<i class="fas ${icon}"></i> ${title}<span class="page-count">(${sites.length})</span>`;

    const grid = document.getElementById('cards-grid');
    
    if (FX.mode === 'finder') {
        let html = '';
        const grouped = {};
        sites.forEach(s => { const key = s.groupId || ('cat_' + s.categoryId); if (!grouped[key]) grouped[key] = []; grouped[key].push(s); });
        
        for (const [key, groupSites] of Object.entries(grouped)) {
            let groupName = 'Без группы', groupIcon = 'fa-folder';
            if (key.startsWith('cat_')) { const cat = DATA.categories.find(c => c.id === parseInt(key.replace('cat_', ''))); if (cat) { groupName = cat.name; groupIcon = cat.icon; } }
            else { const grp = DATA.groups.find(g => g.id === parseInt(key)); if (grp) { groupName = grp.name; groupIcon = grp.icon; } }
            const isCollapsed = DATA.collapsedGroups && DATA.collapsedGroups[key];
            
            html += `<div class="group-section"><div class="group-header ${isCollapsed ? 'collapsed' : ''}" onclick="toggleGroupCollapse('${key}')"><i class="fas fa-chevron-down toggle"></i><i class="fas ${groupIcon} icon"></i><span class="title">${groupName}</span><span class="count">${groupSites.length}</span></div><div class="group-grid">${groupSites.map(s => renderCard(s)).join('')}<div class="site-card add-card" onclick="showSiteModal()"><i class="fas fa-plus"></i><span>Добавить</span></div></div></div>`;
        }
        grid.innerHTML = html;
    } else {
        let html = sites.map(s => renderCard(s)).join('');
        html += `<div class="site-card add-card" onclick="showSiteModal()"><i class="fas fa-plus"></i><span>Добавить</span></div>`;
        
        const cols = Math.min(FX.gridCols, maxCols);
        const totalCards = sites.length + 1;
        const remainder = totalCards % cols;
        
        // Добавляем placeholder-ы для заполнения текущей строки
        if (remainder > 0) { 
            for (let i = 0; i < cols - remainder; i++) {
                html += `<div class="site-card placeholder"></div>`; 
            }
        }
        
        // Рассчитываем сколько строк placeholder-ов нужно для заполнения видимой области
        const cardHeight = (FX.cardHeight || 140) * (FX.cardScale || 100) / 100;
        const gap = FX.gridGap || 16;
        const viewHeight = window.innerHeight - 200; // примерная высота видимой области
        const rowsOnScreen = Math.ceil(viewHeight / (cardHeight + gap));
        const currentRows = Math.ceil(totalCards / cols);
        const extraRows = Math.max(0, rowsOnScreen - currentRows + 1);
        
        // Добавляем дополнительные строки placeholder-ов
        for (let r = 0; r < extraRows; r++) {
            for (let i = 0; i < cols; i++) {
                html += `<div class="site-card placeholder" style="opacity:${0.4 - r * 0.1};"></div>`; 
            }
        }
        
        grid.innerHTML = html;
    }
    initCardsSortable();
}

function renderCard(s) {
    const bgColor = s.bg || '#6366f1';
    // v109 FIX: Правильное извлечение домена для favicon
    const iconHtml = (() => {
        // Если есть явная иконка (FontAwesome класс)
        if (s.icon && s.icon.trim()) {
            return `<i class="${escapeHtml(s.icon)}"></i>`;
        }
        // Извлекаем домен из URL для favicon
        const url = normalizeUrl(s.url);
        try {
            const host = new URL(url).hostname;
            if (host) {
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=128`;
                const fallbackLetter = (s.name || '').trim() ? s.name.trim()[0].toUpperCase() : '🌐';
                return `<img src="${faviconUrl}" alt="" onerror="this.onerror=null;this.style.display='none';this.parentElement.innerHTML='<span class=\\'fallback-letter\\'>${fallbackLetter}</span>';">`;
            }
        } catch(e) {}
        // Fallback: первая буква имени или глобус
        const letter = (s.name || '').trim() ? s.name.trim()[0].toUpperCase() : '🌐';
        return `<span class="fallback-letter">${escapeHtml(letter)}</span>`;
    })();

    // v118: Скриншот для preview/screenshot режимов
    let screenshotStyle = '';
    if (FX.mode === 'preview' || FX.mode === 'screenshot') {
        try {
            const url = normalizeUrl(s.url);
            const host = new URL(url).hostname;
            // Используем различные сервисы скриншотов
            const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=true&meta=false&embed=screenshot.url`;
            // Fallback на gradient если скриншот не загрузится
            screenshotStyle = `background-image: linear-gradient(135deg, ${bgColor}33 0%, ${bgColor}66 100%), url('https://image.thum.io/get/width/400/${encodeURIComponent(url)}');`;
        } catch(e) {
            screenshotStyle = `background: linear-gradient(135deg, ${bgColor}33 0%, ${bgColor}66 100%);`;
        }
    }

    const isSel = Array.isArray(state.selectedIds) && state.selectedIds.includes(Number(s.id));
    // v111: Always show checkbox in select mode, with checkmark when selected
    const selHtml = state.selectMode ? `<button class="card-select ${isSel ? 'on' : ''}" onclick="event.stopPropagation();toggleSelectSite(${s.id})" title="Выбрать" aria-label="Выбрать">
        <i class="fas fa-check"></i>
    </button>` : '';

    return `
        <div class="site-card ${isSel ? 'is-selected' : ''} ${isSearchMatch(s) ? 'search-match' : ''}" data-id="${s.id}" data-url="${escapeHtml(normalizeUrl(s.url))}" onclick="handleCardClick(event)" style="${screenshotStyle}">\n            ${selHtml}
            <div class="card-drag" title="Перетащить"><i class="fas fa-grip-lines"></i></div>
            <div class="card-actions">
                <button class="card-act" onclick="event.stopPropagation();showSiteInfo(${s.id})" title="Информация"><i class="fas fa-info-circle"></i></button>
                <button class="card-act star ${s.starred ? 'active' : ''}" onclick="event.stopPropagation();toggleStar(${s.id})" title="Избранное"><i class="fas fa-star"></i></button>
                <button class="card-act" onclick="event.stopPropagation();editSite(${s.id})" title="Редактировать"><i class="fas fa-edit"></i></button>
                <button class="card-act delete" onclick="event.stopPropagation();deleteSite(${s.id})" title="Удалить"><i class="fas fa-trash"></i></button>
            </div>
            <div class="card-icon-wrap" style="background:${bgColor};"><div class="card-icon">${iconHtml}</div></div>
            <div class="card-info">
                <div class="card-title">${escapeHtml(s.name)}</div>
                <div class="card-desc">${escapeHtml(s.desc || '')}</div>
            </div>
        </div>
    `;
}

function handleCardClick(e) {
    const card = e.currentTarget;
    if (state.selectMode) { toggleSelectSite(card.dataset.id); return; }
    
    // v109: Получаем URL из data-атрибута для безопасности
    const url = card.dataset.url;
    if (!url) return;
    
    // v112: Track click statistics
    const siteId = Number(card.dataset.id);
    if (siteId) trackClick(siteId);
    
    if (FX.press === 'ripple') {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--rx', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--ry', (e.clientY - rect.top) + 'px');
        card.classList.add('ripple-on');
        setTimeout(() => card.classList.remove('ripple-on'), 560);
    }
    window.open(url, '_blank');
}

function toggleSelectSite(id) {
    if (!Array.isArray(state.selectedIds)) state.selectedIds = [];
    const n = Number(id);
    const idx = state.selectedIds.indexOf(n);
    if (idx >= 0) state.selectedIds.splice(idx, 1);
    else state.selectedIds.push(n);

    const card = document.querySelector(`.site-card[data-id="${n}"]`);
    if (card) card.classList.toggle('is-selected', idx < 0);

    updateMiniNavPanel();
    updateSelectFloat();
}

function openSelectedSites() {
    if (!Array.isArray(state.selectedIds) || state.selectedIds.length === 0) {
        showToast('Ничего не выбрано');
        return;
    }
    
    const ids = new Set(state.selectedIds.map(Number));
    const list = (window.__currentViewSites || DATA.sites).filter(s => ids.has(Number(s.id)));
    
    let opened = 0;
    let blocked = 0;
    
    list.forEach(s => { 
        if (s?.url) {
            // Track click
            trackClick(s.id);
            // Open
            const w = window.open(s.url, '_blank');
            if (w) opened++;
            else blocked++;
        }
    });
    
    // Feedback
    if (opened > 0) {
        showToast(`Открыто ${opened} сайт${opened === 1 ? '' : opened < 5 ? 'а' : 'ов'}`);
    }
    if (blocked > 0) {
        showToast('Браузер заблокировал некоторые вкладки. Разрешите всплывающие окна.', 'warning');
    }
}

function expandAllSections() {

    const sites = window.__currentViewSites || [];
    const keys = new Set();
    sites.forEach(s => keys.add(s.groupId ? String(s.groupId) : ('cat_' + String(s.categoryId))));
    keys.forEach(k => { DATA.collapsedGroups[k] = false; });
    saveData();
    renderContent();
}

function collapseAllSections() {
    if (!DATA.collapsedGroups) DATA.collapsedGroups = {};
    const sites = window.__currentViewSites || [];
    const keys = new Set();
    sites.forEach(s => keys.add(s.groupId ? String(s.groupId) : ('cat_' + String(s.categoryId))));
    keys.forEach(k => { DATA.collapsedGroups[k] = true; });
    saveData();
    renderContent();
}

function createFolderFromContext() {
    // Create a folder inside current category. Folder = group with isFolder:true, parentFolderId:null
    if(!state.categoryId){
      if(state.profileId) { showEditModal('category', state.profileId); return; }
      showEditModal('profile', null); return;
    }
    const name = prompt('Название папки', 'Новая папка');
    if(!name) return;
    const id = nextId(DATA.groups);
    DATA.groups.push({ id, categoryId: state.categoryId, name: String(name).trim(), icon: 'fa-folder', isFolder:true, parentFolderId:null });
    if(!state.openFolders) state.openFolders = {};
    state.openFolders[id] = true;
    state.groupId = id;
    pushHistory('Создана папка: ' + name);
    saveAll();
    renderAll();
}

let __sidebarSortInited = false;
function initSidebarSortable(){
    if (!window.Sortable) return;
    // Prevent re-init thrash on re-render: we rebuild DOM, so we allow re-init safely by destroying old instances.
    // We track per-container instances on element.
    const sidebar = document.getElementById('sidebar-tree');
    if (!sidebar) return;

    // Profiles reorder
    if (sidebar._sortable) sidebar._sortable.destroy();
    sidebar._sortable = Sortable.create(sidebar, {
        animation: 150,
        handle: '.drag-handle',
        draggable: '.tree-section',
        filter: '.add-item-btn',
        onEnd: () => {
            const ids = [...sidebar.querySelectorAll('.tree-section')].map(el => Number(el.dataset.profileId));
            const map = new Map(DATA.profiles.map(p => [p.id, p]));
            DATA.profiles = ids.map(id => map.get(id)).filter(Boolean);
            saveData();
            renderSegments();
            renderSidebar();
        }
    });

    // Categories reorder per profile
    sidebar.querySelectorAll('.tree-children[data-profile-id]').forEach(cont => {
        if (cont._sortable) cont._sortable.destroy();
        cont._sortable = Sortable.create(cont, {
            animation: 150,
            handle: '.drag-handle',
            draggable: '.tree-category',
            filter: '.add-item-btn, .tree-group, .tree-group-list',
            onEnd: () => {
                const pid = Number(cont.dataset.profileId);
                const order = [...cont.querySelectorAll('.tree-category')].map(el => Number(el.dataset.categoryId));
                const map = new Map(DATA.categories.filter(c => c.profileId === pid).map(c => [c.id, c]));
                const sorted = order.map(id => map.get(id)).filter(Boolean);

                let i = 0;
                DATA.categories = DATA.categories.map(c => (c.profileId === pid ? sorted[i++] || c : c));
                saveData();
                pushHistory({type:'data', label:'Проводник: сортировка профилей', silent:false});
                renderSegments();
                renderSidebar();
            }
        });
    });

    // Groups reorder per category
    sidebar.querySelectorAll('.tree-group-list[data-category-id]').forEach(cont => {
        if (cont._sortable) cont._sortable.destroy();
        cont._sortable = Sortable.create(cont, {
            animation: 150,
            handle: '.drag-handle',
            draggable: '.tree-group',
            filter: '.add-item-btn',
            onEnd: () => {
                const cid = Number(cont.dataset.categoryId);
                const order = [...cont.querySelectorAll('.tree-group')].map(el => Number(el.dataset.groupId));
                const map = new Map(DATA.groups.filter(g => g.categoryId === cid).map(g => [g.id, g]));
                const sorted = order.map(id => map.get(id)).filter(Boolean);

                let i = 0;
                DATA.groups = DATA.groups.map(g => (g.categoryId === cid ? sorted[i++] || g : g));
                saveData();
                pushHistory({type:'data', label:'Проводник: сортировка категорий', silent:false});
                renderSegments();
                renderSidebar();
            }
        });
    });
}

function buildSmartResults(q){
    q = normalizeQuery(q);
    if (!q) return [];
    const res = [];
    const push = (item)=>res.push(item);

    // Profiles
    (DATA.profiles||[]).forEach(p=>{
        const t = (p.name||'').toLowerCase();
        if (t.includes(q)) push({ type:'profile', id:p.id, title:p.name, sub:'Профиль', icon:p.icon||'fa-user' });
    });
    // Categories
    (DATA.categories||[]).forEach(c=>{
        const t = (c.name||'').toLowerCase();
        if (t.includes(q)) {
            const p = (DATA.profiles||[]).find(x=>x.id===c.profileId);
            push({ type:'category', id:c.id, profileId:c.profileId, title:c.name, sub: p?`Профиль: ${p.name}`:'Категория', icon:c.icon||'fa-layer-group' });
        }
    });
    // Groups
    (DATA.groups||[]).forEach(g=>{
        const t = (g.name||'').toLowerCase();
        if (t.includes(q)) {
            const c = (DATA.categories||[]).find(x=>x.id===g.categoryId);
            const p = c ? (DATA.profiles||[]).find(x=>x.id===c.profileId) : null;
            push({ type:'group', id:g.id, categoryId:g.categoryId, profileId: p?.id, title:g.name, sub: c?`Категория: ${c.name}`:'Группа', icon:g.icon||'fa-folder' });
        }
    });
    // Sites
    (DATA.sites||[]).forEach(s=>{
        const tags = Array.isArray(s.tags)?s.tags.join(' '):'';
        const hay = `${s.name||''} ${s.url||''} ${s.desc||''} ${tags}`.toLowerCase();
        if (hay.includes(q)) {
            const c = (DATA.categories||[]).find(x=>x.id===s.categoryId);
            const p = c ? (DATA.profiles||[]).find(x=>x.id===c.profileId) : null;
            const g = s.groupId ? (DATA.groups||[]).find(x=>x.id===s.groupId) : null;
            const path = [p?.name, c?.name, g?.name].filter(Boolean).join(' › ');
            push({ type:'site', id:s.id, title:s.name, sub: path || s.url, icon:'fa-globe', url:s.url });
        }
    });


    // Browsers (search + select)
    (BROWSERS||[]).forEach(b=>{
        const t = (b.name||'').toLowerCase();
        if (t.includes(q) || (b.id||'').toLowerCase().includes(q)) {
            push({ type:'browser', id:b.id, title:b.name, sub:'Браузер', icon: b.icon || 'fa-window-maximize' });
        }
    });

    // Rank: substring position + type weight
    const w = { profile: 3, category: 4, group: 5, site: 6 };
    const score = (it)=>{
        const txt = (it.title||'').toLowerCase();
        const i = txt.indexOf(q);
        return (i>=0 ? (100 - i) : 0) + (w[it.type]||0);
    };
    return res
      .sort((a,b)=>score(b)-score(a))
      .slice(0, 24);
}

// v112: Web search function
function searchInWeb() {
    const inp = document.getElementById('global-search');
    const engineSelect = document.getElementById('search-engine-select');
    if (!inp) return;
    
    const query = inp.value.trim();
    if (!query) {
        showToast('Введите поисковый запрос');
        return;
    }
    
    const engine = engineSelect?.value || 'google';
    let url;
    
    switch (engine) {
        case 'yandex':
            url = `https://yandex.ru/search/?text=${encodeURIComponent(query)}`;
            break;
        case 'duckduckgo':
            url = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            break;
        case 'bing':
            url = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
            break;
        case 'perplexity':
            url = `https://www.perplexity.ai/?q=${encodeURIComponent(query)}`;
            break;
        case 'google':
        default:
            url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            break;
    }
    
    window.open(url, '_blank');
    showToast(`Поиск: ${query}`);
    toggleSearchDrawer(false);
}

function handleSearchKey(e){
    const key = e.key;
    if (key === 'Escape') {
        e.preventDefault();
        const inp = document.getElementById('global-search');
        if (inp && inp.value) { inp.value=''; smartSearch(''); }
        closeSmartDropdown();
        return;
    }
    if (key === 'ArrowDown' && __SMART.open) {
        e.preventDefault();
        __SMART.active = Math.min(__SMART.active + 1, __SMART.items.length - 1);
        const picker = document.getElementById('browser-picker');
    if (picker && picker.classList.contains('open')) renderBrowserPicker(state.search);
    renderSmartDropdown();
        return;
    }
    if (key === 'ArrowUp' && __SMART.open) {
        e.preventDefault();
        __SMART.active = Math.max(__SMART.active - 1, 0);
        const picker = document.getElementById('browser-picker');
    if (picker && picker.classList.contains('open')) renderBrowserPicker(state.search);
    renderSmartDropdown();
        return;
    }
    if (key === 'Enter') {
        e.preventDefault();
        // If dropdown has results, select active item
        if (__SMART.open && __SMART.items.length && __SMART.active >= 0) {
            selectSmartResult(__SMART.active);
            return;
        }
        // Otherwise search in web if there's a query
        const inp = document.getElementById('global-search');
        if (inp && inp.value.trim()) {
            searchInWeb();
            return;
        }
        // Fallback: scroll to first match
        const first = document.querySelector('.site-card.search-match');
        if (first) {
            first.scrollIntoView({ behavior:'smooth', block:'center' });
            first.classList.add('search-flash');
            setTimeout(()=>first.classList.remove('search-flash'), 1300);
        }
        return;
    }
}

function selectSmartResult(idx){
    const it = __SMART.items[idx];
    if (!it) return;
    closeSmartDropdown();

    const inp = document.getElementById('global-search');
    if (inp) inp.blur();

    // Clear filter, then navigate
    state.search = '';
    if (inp) inp.value = '';

    if (it.type === 'profile') {
        selectProfile(it.id);
        showToast('Профиль: ' + it.title);
        return;
    }
    if (it.type === 'category') {
        state.profileId = it.profileId || state.profileId;
        selectCategory(it.id);
        showToast('Категория: ' + it.title);
        return;
    }
    if (it.type === 'group') {
        if (it.profileId) state.profileId = it.profileId;
        state.categoryId = it.categoryId || state.categoryId;
        selectGroup(it.id);
        showToast('Группа: ' + it.title);
        return;
    }
    if (it.type === 'browser') {
        setOpenBrowser(it.id);
        showToast('Браузер: ' + it.title);
        return;
    }
    if (it.type === 'site') {
        // Navigate to its container
        const s = (DATA.sites||[]).find(x=>Number(x.id)===Number(it.id));
        if (s) {
            const cat = (DATA.categories||[]).find(c=>Number(c.id)===Number(s.categoryId));
            if (cat) state.profileId = cat.profileId;
            state.categoryId = s.categoryId;
            state.groupId = s.groupId || null;
            render();
            // Wait DOM paint then scroll & highlight
            setTimeout(()=>{
                const el = document.querySelector(`.site-card[data-id="${s.id}"]`);
                if (el) {
                    el.scrollIntoView({ behavior:'smooth', block:'center' });
                    el.classList.add('search-flash');
                    setTimeout(()=>el.classList.remove('search-flash'), 1300);
                }
            }, 60);
        }
        return;
    }
}

/* ===== v99: Data History keybindings (undo/redo) ===== */
document.addEventListener('keydown', (e)=>{
    const key = (e.key||'').toLowerCase();
    const inField = ['input','textarea'].includes((document.activeElement?.tagName||'').toLowerCase()) || document.activeElement?.isContentEditable;
    if (inField) return;

    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;

    // Ctrl/Cmd+Z
    if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
    // Ctrl/Cmd+Shift+Z
    if (key === 'z' && e.shiftKey) { e.preventDefault(); redo(); return; }
    // Ctrl/Cmd+Y
    if (key === 'y') { e.preventDefault(); redo(); return; }
}, true);

    const tongue = document.getElementById('nav-tongue');
    if (tongue) tongue.title = collapsed ? 'Развернуть панель' : 'Свернуть панель';
}

function showCtxMenu(e, type, id) { e.preventDefault(); e.stopPropagation(); const menu = document.getElementById('ctx-menu'); menu.style.display = 'block'; menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px'; menu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px'; menu.innerHTML = `<div class="ctx-item" onclick="showEditModal('${type}',null,${id})"><i class="fas fa-pen"></i>Редактировать</div><div class="ctx-sep"></div><div class="ctx-item danger" onclick="deleteItem('${type}',${id})"><i class="fas fa-trash"></i>Удалить</div>`; setTimeout(() => document.addEventListener('click', hideCtx, { once: true }), 10); }

    editingSiteId = null; 
    document.getElementById('site-modal-title').textContent = 'Добавить сайт';

function editSite(id) { 
    const s = DATA.sites.find(x => x.id === id); 
    if (!s) return; 
    hideCtx(); 
    editingSiteId = id; 
    document.getElementById('site-modal-title').textContent = 'Редактировать'; 
    document.getElementById('site-name').value = s.name; 
    document.getElementById('site-url').value = s.url; 
    document.getElementById('site-desc').value = s.desc || ''; 
    document.getElementById('site-bg-color').value = s.bg || '#6366f1';
    document.getElementById('site-modal').classList.add('show'); 
}
function saveSite() { 
    const name = document.getElementById('site-name').value.trim(); 
    const url = document.getElementById('site-url').value.trim(); 
    const desc = document.getElementById('site-desc').value.trim(); 
    const bg = document.getElementById('site-bg-color').value || '#6366f1';
    
    if (!name || !url) return alert('Заполните название и URL'); 
    
    if (editingSiteId) { 
        const s = DATA.sites.find(x => x.id === editingSiteId); 
        if (s) { 
            s.name = name; 
            s.url = url; 
            s.desc = desc; 
            s.bg = bg;
        } 
    } else { 
        const catId = state.categoryId || DATA.categories.find(c => c.profileId === state.profileId)?.id || DATA.categories[0]?.id; 
        DATA.sites.push({ 
            id: Date.now(), 
            name, 
            url, 
            desc, 
            categoryId: catId, 
            groupId: state.groupId, 
            icon: '', 
            bg: bg, 
            starred: false,
            createdAt: new Date().toISOString()
        }); 
    } 
    saveData(); 
    pushHistory({type:'data', label: (editingSiteId ? 'Сайт: редактирование' : 'Сайт: добавление'), silent:false}); 
    closeModal('site-modal'); 
    renderContent(); 
    showToast('Сохранено'); 
}

// v112: Extract color from favicon for current site being edited
function extractColorForCurrentSite() {
    const urlInput = document.getElementById('site-url');
    const colorInput = document.getElementById('site-bg-color');
    
    if (!urlInput || !urlInput.value.trim()) {
        showToast('Сначала введите URL сайта');
        return;
    }
    
    try {
        const domain = new URL(normalizeUrl(urlInput.value.trim())).hostname;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128`;
        
        showToast('Извлекаем цвет...');
        
        extractDominantColor(faviconUrl, (color) => {
            if (color && colorInput) {
                // Convert rgb to hex
                const rgbMatch = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
                if (rgbMatch) {
                    const r = parseInt(rgbMatch[1]);
                    const g = parseInt(rgbMatch[2]);
                    const b = parseInt(rgbMatch[3]);
                    const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
                    colorInput.value = hex;
                    showToast('Цвет извлечён: ' + hex);
                } else {
                    showToast('Не удалось определить цвет');
                }
            } else {
                showToast('Не удалось извлечь цвет');
            }
        });
    } catch (e) {
        showToast('Ошибка: проверьте URL');
    }
}

 editType = type; editParentId = parentId; editId = existingId; closeBreadDropdowns(true); const titles = { profile: 'профиль', category: 'категорию', group: 'группу' }; document.getElementById('edit-modal-title').textContent = (existingId ? 'Редактировать ' : 'Добавить ') + titles[type]; let item = { name: '', icon: 'fa-folder' }; if (existingId) { const arr = type === 'profile' ? DATA.profiles : type === 'category' ? DATA.categories : DATA.groups; item = arr.find(x => x.id === existingId) || item; } document.getElementById('edit-modal-body').innerHTML = `<div class="form-group"><label>Название</label><input class="form-input" id="edit-name" value="${item.name}" placeholder="Название"></div><div class="form-group"><label>Иконка</label><div class="icon-grid">${ICONS.map(ic => `<div class="icon-opt ${item.icon === ic ? 'selected' : ''}" onclick="selectEditIcon(this,'${ic}')"><i class="fas ${ic}"></i></div>`).join('')}</div><input type="hidden" id="edit-icon" value="${item.icon}"></div>`; document.getElementById('edit-modal').classList.add('show'); }

function deleteItem(type, id) { if (!confirm('Удалить?')) return; if (type === 'profile') { DATA.profiles = DATA.profiles.filter(x => x.id !== id); const catIds = DATA.categories.filter(c => c.profileId === id).map(c => c.id); DATA.categories = DATA.categories.filter(c => c.profileId !== id); DATA.groups = DATA.groups.filter(g => !catIds.includes(g.categoryId)); DATA.sites = DATA.sites.filter(s => !catIds.includes(s.categoryId)); if (state.profileId === id) state.profileId = DATA.profiles[0]?.id; } else if (type === 'category') { DATA.categories = DATA.categories.filter(x => x.id !== id); DATA.groups = DATA.groups.filter(g => g.categoryId !== id); DATA.sites = DATA.sites.filter(s => s.categoryId !== id); if (state.categoryId === id) { state.categoryId = null; state.groupId = null; } } else { DATA.groups = DATA.groups.filter(x => x.id !== id); DATA.sites.forEach(s => { if (s.groupId === id) s.groupId = null; }); if (state.groupId === id) state.groupId = null; } saveData(); hideCtx(); render(); showToast('Удалено'); }
