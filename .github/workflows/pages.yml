name: Deploy Nexus preview to GitHub Pages

on:
  push:
    branches:
      - arena/01a0a900-nexus-speed-dial
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nexus-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload standalone preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexus-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Stage standalone preview payload
        if: github.actor != 'github-actions[bot]'
        run: |
          rm -rf .nexus-preview-dist
          mkdir -p .nexus-preview-dist
          cp -R dist/. .nexus-preview-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .nexus-preview-dist
          git commit -m "chore: stage Nexus preview payload [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
