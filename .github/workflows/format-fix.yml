name: One-shot whitespace repair

on:
  push:
    branches:
      - arena/01a0a900-nexus-speed-dial

permissions:
  contents: write

jobs:
  repair:
    if: github.sha == 'ecf0e4f71d044bebcb00fdd0ce13f0c8d9cbbb87'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Remove trailing whitespace
        run: sed -i 's/[[:blank:]]\+$//' src/components/SettingsPanel.tsx
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsPanel.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: remove trailing whitespace"
          git push origin HEAD:arena/01a0a900-nexus-speed-dial
