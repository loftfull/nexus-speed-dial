name: Visual baseline candidate

on:
  push:
    branches:
      - arena/01a0a900-nexus-speed-dial

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Capture reviewed baselines
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Commit reviewed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: add reviewed visual baselines"
          git push origin HEAD:arena/01a0a900-nexus-speed-dial
