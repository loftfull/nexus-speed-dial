name: Visual baseline candidate

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0a900-nexus-speed-dial
      - arena/01a0a900-nexus-speed-dial-v2
    paths:
      - .github/visual-review-request

permissions:
  contents: write
  # Нужно, чтобы шлюз мог сам запустить проверку по принятым эталонам: пуш,
  # сделанный с GITHUB_TOKEN, рабочих процессов не запускает — так GitHub
  # защищается от бесконечной рекурсии. Без этого шага принятые эталоны
  # оставались непроверенными до следующего ручного пуша.
  actions: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect review mode
        id: review
        shell: bash
        run: |
          mode=candidate
          if [ "${{ github.event_name }}" = "push" ] && grep -qx 'mode=accept' .github/visual-review-request; then
            mode=accept
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # Пересъёмка всегда полная. При `--update-snapshots` без значения
      # Playwright решает сам, что считать изменившимся, и в прогоне 93 он
      # объявил desktop-home совпавшим с эталоном, в котором ещё стояла
      # убранная панель «Сеткой / По группам». Поэтому решение снято с него:
      # «принято» теперь буквально означает «сняли заново всё».
      #
      # Раньше здесь стояло «почему проверка их не увидела, я объяснить не
      # могу». Теперь могу, и объяснение стоит записать. Допуск сверки задан
      # двумя числами, и тогда работало только одно: `maxDiffPixels: 250`
      # стоял осознанно, а `threshold` — по умолчанию, 0.2. Playwright считает
      # расхождение точки по YIQ и берёт порогом `35215·threshold²`, то есть
      # 1408.6; для серого сдвига на d уровней это `0.5053·d²`, откуда
      # совпадением считался сдвиг до 52.8 уровней из 255. Тот самый эталон
      # против правильного даёт один сгусток 83×40 и 3068 точек с
      # расхождением канала больше 32 — но порог 0.2 переходят лишь 97 из
      # них, меньше лимита 250. При 0.1 их 2921. Числа сняты тем самым
      # pixelmatch, который зашит в Playwright, а счётчик проверен на
      # известном ответе. Порог опущен до 0.1 в e2e/visual.spec.ts; разбор —
      # в docs/design-system.md.
      - name: Capture candidate baselines
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=all
      - name: Upload candidate baselines
        uses: actions/upload-artifact@v7
        with:
          name: nexus-visual-baseline-candidate-${{ github.sha }}
          path: e2e/visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7
      - name: Commit explicitly reviewed baselines
        if: steps.review.outputs.mode == 'accept'
        shell: bash
        run: |
          # `git diff` не видит неотслеживаемые файлы, а именно такими
          # возвращаются эталоны, удалённые перед пересъёмкой: в прогоне 94
          # Playwright записал все семь снимков, а шаг доложил «нечего
          # коммитить» и ничего не отправил. `git status --porcelain` видит
          # и изменённые, и новые, и удалённые.
          changed=$(git status --porcelain -- e2e/visual.spec.ts-snapshots)
          if [ -z "$changed" ]; then
            echo 'Reviewed baselines already match; nothing to commit.'
            exit 0
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/visual.spec.ts-snapshots
          git commit -m 'test: accept reviewed visual baseline'
          git push origin HEAD:${GITHUB_REF_NAME}
      # Пуш выше сделан GITHUB_TOKEN, поэтому сам он `Nexus QA` не поднимет:
      # коммит с принятыми эталонами так и остался бы без прогона, и краснота
      # обнаружилась бы только при следующей правке руками. Запуск через API —
      # это не событие пуша, его такое ограничение не касается.
      - name: Check the accepted baselines
        if: steps.review.outputs.mode == 'accept'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run qa.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
