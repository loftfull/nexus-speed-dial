name: Nexus QA

on:
  push:
    branches:
      - arena/01a0a900-nexus-speed-dial
  pull_request:

jobs:
  unit-build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests and build
        run: npm run qa:unit
      - name: Reference guard
        run: npm run qa:reference
      - name: Whitespace check
        run: git diff --check e5e17ae1fab573480b1b48ff2feb7c6f00d618bf HEAD
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run qa:e2e
      - name: Visual baseline check
        run: npm run test:visual
      - name: Upload visual regression evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-visual-regression-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
