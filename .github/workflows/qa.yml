name: Nexus QA

on:
  push:
    branches:
      - arena/01a0a900-nexus-speed-dial-v2
  pull_request:
  workflow_dispatch:

concurrency:
  group: nexus-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast · unit / build / guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests and build
        run: npm run qa:unit
      - name: Reference guard
        run: npm run qa:reference
      - name: Whitespace check
        run: git diff --check e5e17ae1fab573480b1b48ff2feb7c6f00d618bf HEAD

  browser:
    name: Browser · interaction E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run qa:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-browser-evidence-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  visual:
    name: Visual · approved baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Visual baseline check
        run: npm run test:visual
      - name: Upload visual regression evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-visual-regression-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
