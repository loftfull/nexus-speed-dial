function parseNaturalVirtualCommands(q){
  // returns array of extra commands based on natural language
  const v = [];
  const qq = normalizeQuery(q);
  if (!qq) return v;

  const mCreate = qq.match(/^(создать|добавить|нов(ый|ую|ое)|create|add)\s+(.+)$/i);
  if (mCreate) {
    const rest = mCreate[3].trim();
    // patterns: "группу обучение" etc.
    const t = rest.split(/\s+/);
    const type = t[0];
    const name = rest.replace(/^\S+\s*/,'').trim();
    if (/^(сайт|site)\b/.test(type) && name) {
      v.push({ id:'v_add_site', group:'Быстрые', title:`Создать сайт: ${name}`, sub:'Откроет форму добавления', k:qq, shortcut:'', run:()=>{ showSiteModal(); const el=document.getElementById('site-name'); if(el) el.value=name; }});
    }
    if (/^(категор(ия|ию)|category)\b/.test(type) && name) {
      v.push({ id:'v_add_cat', group:'Быстрые', title:`Создать категорию: ${name}`, sub:'В текущем профиле', k:qq, shortcut:'', run:()=>{ showEditModal('category', state.profileId, null); setTimeout(()=>{ const el=document.getElementById('edit-name'); if(el) el.value=name; },0); }});
    }
    if (/^(групп(а|у)|папк(а|у)|group|folder)\b/.test(type) && name) {
      v.push({ id:'v_add_grp', group:'Быстрые', title:`Создать группу: ${name}`, sub:'В текущей категории', k:qq, shortcut:'', run:()=>{ if(!state.categoryId){ showToast('Сначала выберите категорию'); return; } showEditModal('group', state.categoryId, null); setTimeout(()=>{ const el=document.getElementById('edit-name'); if(el) el.value=name; },0); }});
    }
    if (/^(профил(ь|я)|profile)\b/.test(type) && name) {
      v.push({ id:'v_add_prof', group:'Быстрые', title:`Создать профиль: ${name}`, sub:'Новый профиль', k:qq, shortcut:'', run:()=>{ showEditModal('profile', null, null); setTimeout(()=>{ const el=document.getElementById('edit-name'); if(el) el.value=name; },0); }});
    }
  }

  const mFind = qq.match(/^(найти|поиск|find|search)\s+(.+)$/i);
  if (mFind) {
    const term = mFind[2].trim();
    if (term) {
      v.push({ id:'v_find', group:'Быстрые', title:`Найти: ${term}`, sub:'Фильтр по сайтам/описанию/тегам', k:qq, shortcut:'', run:()=>{ state.search = term; renderContent(); showToast('Поиск: ' + term); }});
      v.push({ id:'v_clear_find', group:'Быстрые', title:'Сбросить поиск', sub:'Очистить фильтр', k:'сбросить поиск clear search', shortcut:'', run:()=>{ state.search=''; renderContent(); showToast('Поиск очищен'); }});
    }
  }

  const mOpen = qq.match(/^(открыть|open|перейти)\s+(.+)$/i);
  if (mOpen) {
    const term = mOpen[2].trim();
    if (term && term !== 'настройки') {
      // offer: open first matched site
      const sites = (DATA.sites||[]);
      const best = sites.map(s=>({s,score:fuzzyScore(`${s.name} ${s.url} ${s.desc||''}`, term)})).sort((a,b)=>b.score-a.score)[0];
      if (best && best.score > 120) {
        v.push({ id:'v_open_best', group:'Быстрые', title:`Открыть: ${best.s.name}`, sub:best.s.url, k:qq, shortcut:'', run:()=>window.open(best.s.url,'_blank') });
      }
    }
    if (/настройк/.test(term)) {
      v.push({ id:'v_open_settings', group:'Быстрые', title:'Открыть настройки', sub:'Панель настроек', k:qq, shortcut:'', run:()=>openSettings() });
    }
  }

  return v;
}

function openCommandPalette(mode='global', presetQuery='') {
  if (__CMDP.open) return;
  __CMDP.open = true;
  __CMDP.mode = mode;
  __CMDP.lastFocus = document.activeElement;
  const overlay = document.getElementById('cmdp-overlay');
  const input = document.getElementById('cmdp-input');

  overlay.classList.add('show');
  updateSelectFloat();
  if (mode === 'select') input.placeholder = 'Действия для выбранных… (Cmd/Ctrl+Enter)';
  else input.placeholder = 'Команды: найти / открыть / создать / экспорт / настройки…';

  input.value = presetQuery || '';
  __CMDP.active = 0;

  if (mode === 'select') buildSelectCommands();
  else buildGlobalCommands();

  filterAndRenderCommands();
  setTimeout(()=>input.focus(), 0);
}

function closeCommandPalette() {
  if (!__CMDP.open) return;
  __CMDP.open = false;
  document.getElementById('cmdp-overlay').classList.remove('show');
  updateSelectFloat();
  // restore focus
  try { __CMDP.lastFocus && __CMDP.lastFocus.focus && __CMDP.lastFocus.focus(); } catch(_){}
}

function filterAndRenderCommands() {
  const input = document.getElementById('cmdp-input');
  const q = normalizeQuery(input.value);
  const virtuals = (__CMDP.mode === 'global') ? parseNaturalVirtualCommands(q) : [];
  const all = [...virtuals, ...(__CMDP.commands||[])];

  const scored = all.map(c=>{
    const text = `${c.title||''} ${c.sub||''} ${c.k||''} ${c.group||''}`;
    return { c, score: fuzzyScore(text, q) };
  }).filter(x=> q ? x.score > 20 : true).sort((a,b)=>b.score-a.score);

  __CMDP.filtered = scored.map(x=>x.c).slice(0, 60);
  __CMDP.active = Math.min(__CMDP.active, Math.max(0, __CMDP.filtered.length - 1));
  renderCommandPalette();
}

function renderCommandPalette() {
  const list = document.getElementById('cmdp-list');
  const items = __CMDP.filtered || [];
  if (!items.length) {
    list.innerHTML = `<div class="cmdp-empty">Ничего не найдено. Попробуйте: <span class="cmdp-kbd">найти</span>, <span class="cmdp-kbd">открыть</span>, <span class="cmdp-kbd">создать</span>.</div>`;
    return;
  }
  const html = items.map((c, i)=>{
    const active = i === __CMDP.active ? 'active' : '';
    const chip = c.group ? `<span class="cmdp-chip">${escapeHtml(c.group)}</span>` : '';
    const kbd = c.shortcut ? `<span class="cmdp-kbd">${escapeHtml(c.shortcut)}</span>` : '';
    return `<div class="cmdp-item ${active}" data-idx="${i}">
      <div class="cmdp-left">
        <div class="cmdp-title">${escapeHtml(c.title)}</div>
        <div class="cmdp-sub">${escapeHtml(c.sub||'')}</div>
      </div>
      <div class="cmdp-right">${chip}${kbd}</div>
    </div>`;
  }).join('');
  list.innerHTML = html;
  // click handlers
  list.querySelectorAll('.cmdp-item').forEach(el=>{
    el.addEventListener('click', ()=>{ const idx=Number(el.dataset.idx); __CMDP.active=idx; runActiveCommand(); });
    el.addEventListener('mousemove', ()=>{ const idx=Number(el.dataset.idx); if(!Number.isNaN(idx)) { __CMDP.active=idx; highlightActiveCommand(); }});
  });
  highlightActiveCommand();
}

function highlightActiveCommand(){
  const list = document.getElementById('cmdp-list');
  const els = list.querySelectorAll('.cmdp-item');
  els.forEach(el=> el.classList.toggle('active', Number(el.dataset.idx)===__CMDP.active));
  const activeEl = list.querySelector(`.cmdp-item[data-idx="${__CMDP.active}"]`);
  if (activeEl) activeEl.scrollIntoView({ block:'nearest' });
}

function runActiveCommand(){
  const cmd = (__CMDP.filtered||[])[__CMDP.active];
  if (!cmd || typeof cmd.run !== 'function') return;
  closeCommandPalette();
  try { cmd.run(); } catch(err){ console.error(err); alert(err.message || err); }
}

function openSelectedSitesSafe(closeAfter=false){
  if (!Array.isArray(state.selectedIds) || state.selectedIds.length===0) { showToast('Ничего не выбрано'); return; }
  const ids = new Set(state.selectedIds.map(Number));
  const list = (window.__currentViewSites || DATA.sites).filter(s => ids.has(Number(s.id)));
  let blocked = 0, opened = 0;
  list.forEach((s, i)=>{
    if (!s?.url) return;
    const w = window.open(s.url, '_blank');
    if (w) opened++; else blocked++;
  });
  if (blocked) showToast('Попап-блокер: разрешите всплывающие окна');
  else showToast('Открыто: ' + opened);
  if (closeAfter) { clearSelection(true); }
}

function clearSelection(keepSelectMode=false){
  state.selectedIds = [];
  if (!keepSelectMode && state.selectMode) state.selectMode = false;
  renderContent();
  updateMiniNavPanel();
  updateSelectFloat();
}

function getSelectedSites(){
  const ids = new Set((state.selectedIds||[]).map(Number));
  return (DATA.sites||[]).filter(s=>ids.has(Number(s.id)));
}

function showMoveSelectedModal(){
  const selected = getSelectedSites();
  if (!selected.length) return showToast('Ничего не выбрано');

  const body = document.getElementById('multiop-body');
  const footer = document.getElementById('multiop-footer');
  document.getElementById('multiop-title').textContent = `Переместить (${selected.length})`;

  const profOptions = (DATA.profiles||[]).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const catForProfile = (pid)=> (DATA.categories||[]).filter(c=>c.profileId===Number(pid));
  const grpForCat = (cid)=> (DATA.groups||[]).filter(g=>g.categoryId===Number(cid));

  const currentCat = state.categoryId || selected[0].categoryId;
  let currentProfile = state.profileId;
  if (currentCat) {
    const cc = DATA.categories.find(c=>c.id===Number(currentCat));
    if (cc) currentProfile = cc.profileId;
  }

  body.innerHTML = `
    <div class="form-row">
      <div style="flex:1;">
        <label class="form-label">Профиль</label>
        <select class="form-select" id="move-profile">${profOptions}</select>
      </div>
      <div style="flex:1;">
        <label class="form-label">Категория</label>
        <select class="form-select" id="move-category"></select>
      </div>
      <div style="flex:1;">
        <label class="form-label">Группа (опционально)</label>
        <select class="form-select" id="move-group"></select>
      </div>
    </div>
    <div style="margin-top:10px; font-size:12px; color:rgba(0,0,0,.55);">Группа привязана к категории. Если выберите категорию без групп — будет <b>без группы</b>.</div>
  `;

  footer.innerHTML = `
    <button class="btn" onclick="closeModal('multiop-modal')">Отмена</button>
    <button class="btn" style="background:var(--accent);color:white;" onclick="applyMoveSelected()">Переместить</button>
  `;

  const profSel = document.getElementById('move-profile');
  const catSel = document.getElementById('move-category');
  const grpSel = document.getElementById('move-group');

  profSel.value = String(currentProfile || (DATA.profiles?.[0]?.id||1));

  function fillCats(){
    const cats = catForProfile(profSel.value);
    catSel.innerHTML = cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('') || `<option value="">— нет категорий —</option>`;
    if (currentCat && cats.some(c=>c.id===Number(currentCat))) catSel.value = String(currentCat);
    fillGroups();
  }
  function fillGroups(){
    const gs = catSel.value ? grpForCat(catSel.value) : [];
    grpSel.innerHTML = [`<option value="">— без группы —</option>`, ...gs.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`)].join('');
    // try keep current group
    const cg = state.groupId || selected[0].groupId;
    if (cg && gs.some(g=>g.id===Number(cg))) grpSel.value = String(cg);
    else grpSel.value = "";
  }
  profSel.onchange = ()=>{ currentCat=null; fillCats(); };
  catSel.onchange = ()=>{ fillGroups(); };
  fillCats();

  window.applyMoveSelected = function(){
    const categoryId = Number(catSel.value);
    const groupId = grpSel.value ? Number(grpSel.value) : null;
    if (!categoryId) return alert('Выберите категорию');
    const ids = new Set((state.selectedIds||[]).map(Number));
    DATA.sites.forEach(s=>{
      if (!ids.has(Number(s.id))) return;
      s.categoryId = categoryId;
      s.groupId = groupId;
    });
    saveData();
    pushHistory({type:'data', label:'SELECT: перемещение', silent:false});
    closeModal('multiop-modal');
    render();
    updateMiniNavPanel();
    showToast('Перемещено');
  };

  document.getElementById('multiop-modal').classList.add('show');
}

function showTagModal(mode){
  const selected = getSelectedSites();
  if (!selected.length) return showToast('Ничего не выбрано');

  const body = document.getElementById('multiop-body');
  const footer = document.getElementById('multiop-footer');
  document.getElementById('multiop-title').textContent = (mode==='remove' ? `Удалить теги (${selected.length})` : `Добавить теги (${selected.length})`);

  const existing = new Set();
  selected.forEach(s=> (Array.isArray(s.tags)?s.tags:[]).forEach(t=>existing.add(String(t).trim())));
  const existingHtml = [...existing].slice(0,24).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('');

  body.innerHTML = `
    <label class="form-label">${mode==='remove'?'Какие теги убрать':'Какие теги добавить'}</label>
    <input class="form-input" id="tags-input" placeholder="например: work, ai, read" />
    <div class="tag-chips">${existingHtml || `<span style="opacity:.6;font-size:12px;">У выбранных пока нет тегов</span>`}</div>
    <div style="margin-top:10px; font-size:12px; opacity:.7;">Разделяйте запятой или пробелом.</div>
  `;

  footer.innerHTML = `
    <button class="btn" onclick="closeModal('multiop-modal')">Отмена</button>
    <button class="btn" style="background:var(--accent);color:white;" onclick="applyTagsToSelected('${mode}')">${mode==='remove'?'Удалить':'Добавить'}</button>
  `;

  window.applyTagsToSelected = function(mode){
    const raw = document.getElementById('tags-input').value || '';
    const tags = raw.split(/[,\n]+|\s{2,}/).join(',').split(',').map(t=>t.trim()).filter(Boolean);
    if (!tags.length) return alert('Введите хотя бы один тег');
    const ids = new Set((state.selectedIds||[]).map(Number));
    DATA.sites.forEach(s=>{
      if (!ids.has(Number(s.id))) return;
      if (!Array.isArray(s.tags)) s.tags = [];
      const set = new Set(s.tags.map(t=>String(t).trim()).filter(Boolean));
      if (mode==='remove') tags.forEach(t=>set.delete(t));
      else tags.forEach(t=>set.add(t));
      s.tags = [...set];
    });
    saveData();
    pushHistory({type:'data', label: (mode==='remove'?'SELECT: теги удалены':'SELECT: теги добавлены'), silent:false});
    closeModal('multiop-modal');
    renderContent();
    updateMiniNavPanel();
    showToast(mode==='remove'?'Теги удалены':'Теги добавлены');
  };

  document.getElementById('multiop-modal').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('tags-input'); el && el.focus(); }, 0);
}

function moveSelectedToTrash(){
  const selected = getSelectedSites();
  if (!selected.length) return showToast('Ничего не выбрано');
  if (!confirm(`Переместить в корзину (${selected.length})?`)) return;
  ensureTrash();
  const ids = new Set((state.selectedIds||[]).map(Number));
  const keep = [];
  (DATA.sites||[]).forEach(s=>{
    if (ids.has(Number(s.id))) {
      DATA.trash.push({ ...s, deletedAt: Date.now() });
    } else keep.push(s);
  });
  DATA.sites = keep;
  saveData();
  pushHistory({type:'data', label:'SELECT: в корзину', silent:false});
  clearSelection(true);
  render();
  showToast('В корзине: ' + selected.length);
}

function deleteSelectedPermanent(){
  const selected = getSelectedSites();
  if (!selected.length) return showToast('Ничего не выбрано');
  if (!confirm(`Удалить навсегда (${selected.length})?`)) return;
  const ids = new Set((state.selectedIds||[]).map(Number));
  DATA.sites = (DATA.sites||[]).filter(s=>!ids.has(Number(s.id)));
  saveData();
  pushHistory({type:'data', label:'SELECT: удалено навсегда', silent:false});
  clearSelection(true);
  render();
  showToast('Удалено');
}

async function copySelectedUrls(){
  const selected = getSelectedSites();
  if (!selected.length) return showToast('Ничего не выбрано');
  const txt = selected.map(s=>s.url).filter(Boolean).join('\n');
  try {
    await navigator.clipboard.writeText(txt);
    showToast('Скопировано: ' + selected.length);
  } catch(err){
    // fallback
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    showToast('Скопировано: ' + selected.length);
  }
}

function exportSelected(fmt){
  const selected = getSelectedSites();
  if (!selected.length) return showToast('Ничего не выбрано');

  let content = '';
  let mime = 'text/plain';
  let ext = fmt;

  if (fmt === 'json') {
    mime = 'application/json';
    ext = 'json';
    content = JSON.stringify({ selectedSites: selected }, null, 2);
  } else if (fmt === 'csv') {
    mime = 'text/csv';
    ext = 'csv';
    const esc = (v)=> {
      const s = String(v ?? '');
      if (/[,"\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
      return s;
    };
    content = 'name,url,description,tags\n' + selected.map(s=>{
      const tags = Array.isArray(s.tags)?s.tags.join(' '):'';
      return [esc(s.name), esc(s.url), esc(s.desc||''), esc(tags)].join(',');
    }).join('\n');
  } else { // md
    mime = 'text/markdown';
    ext = 'md';
    content = selected.map(s=>{
      const desc = s.desc ? ` — ${s.desc}` : '';
      return `- [${s.name}](${s.url})${desc}`;
    }).join('\n');
  }

  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `speed_dial_selected.${ext}`;
  a.click();
  showToast('Экспортировано');
}

function openTrashModal(){
  ensureTrash();
  const wrap = document.getElementById('trash-body');
  const list = (DATA.trash||[]).slice().sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  if (!list.length) {
    wrap.innerHTML = `<div style="opacity:.7">Корзина пуста.</div>`;
  } else {
    wrap.innerHTML = list.map(s=>{
      const when = s.deletedAt ? new Date(s.deletedAt).toLocaleString() : '';
      return `<div class="ctx-item" style="display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--panel);">
        <div style="min-width:0">
          <div style="font-weight:650; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(s.name)}</div>
          <div style="font-size:12px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(s.url)} • ${escapeHtml(when)}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button class="btn" onclick="restoreFromTrash(${s.id})"><i class="fas fa-undo"></i></button>
          <button class="btn" style="background:#ef4444;color:white;" onclick="deleteFromTrash(${s.id})"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('trash-modal').classList.add('show');
}

function restoreFromTrash(id){
  ensureTrash();
  const idx = DATA.trash.findIndex(s=>Number(s.id)===Number(id));
  if (idx<0) return;
  const item = DATA.trash.splice(idx,1)[0];
  delete item.deletedAt;
  DATA.sites.push(item);
  saveData();
  pushHistory({type:'data', label:'Корзина: восстановление', silent:false});
  openTrashModal();
  render();
  showToast('Восстановлено');
}

function deleteFromTrash(id){
  ensureTrash();
  if (!confirm('Удалить из корзины навсегда?')) return;
  DATA.trash = DATA.trash.filter(s=>Number(s.id)!==Number(id));
  saveData();
  pushHistory({type:'data', label:'Корзина: удалено навсегда', silent:false});
  openTrashModal();
  showToast('Удалено');
}

function emptyTrash(){
  ensureTrash();
  if (!DATA.trash.length) return showToast('Корзина пуста');
  if (!confirm('Очистить корзину полностью?')) return;
  DATA.trash = [];
  saveData();
  pushHistory({type:'data', label:'Корзина: очистка', silent:false});
  openTrashModal();
  showToast('Корзина очищена');
}

function bindV97(){
  // Ctrl+P / Cmd+P
  document.addEventListener('keydown', (e)=>{
    if (__CMDP.open) return;
    const key = (e.key||'').toLowerCase();
    const inField = ['input','textarea'].includes((document.activeElement?.tagName||'').toLowerCase()) || document.activeElement?.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && key === 'p') { e.preventDefault(); openCommandPalette('global'); return; }
    if ((e.ctrlKey || e.metaKey) && key === ',') { e.preventDefault(); openSettings(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 't') { e.preventDefault(); FX.theme = (FX.theme==='dark'?'light':'dark'); saveData(); applyCSS(); renderContent(); renderSettings(); showToast('Тема: ' + (FX.theme==='dark'?'тёмная':'светлая')); return; }

    // Mini palette for selected
    if ((e.ctrlKey || e.metaKey) && key === 'enter' && state.selectMode && (state.selectedIds||[]).length) {
      e.preventDefault();
      openCommandPalette('select');
      return;
    }

    // Quick toggle select with "s" (when not typing)
    if (!inField && !e.ctrlKey && !e.metaKey && !e.altKey && key === 's') {
      // avoid when a modal is open
      const anyModal = document.querySelector('.modal.show');
      if (anyModal) return;
      toggleSelectMode();
      return;
    }
  }, true);

  // Command palette interactions
  const overlay = document.getElementById('cmdp-overlay');
  if (overlay) overlay.addEventListener('mousedown', (e)=>{ if (e.target === overlay) closeCommandPalette(); });

  const input = document.getElementById('cmdp-input');
  if (input) {
    input.addEventListener('input', filterAndRenderCommands);
    input.addEventListener('keydown', (e)=>{
      if (!__CMDP.open) return;
      if (e.key === 'Escape') { e.preventDefault(); closeCommandPalette(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); __CMDP.active = Math.min(__CMDP.active + 1, (__CMDP.filtered.length - 1)); highlightActiveCommand(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); __CMDP.active = Math.max(__CMDP.active - 1, 0); highlightActiveCommand(); return; }
      if (e.key === 'Enter') { e.preventDefault(); runActiveCommand(); return; }
      if (e.key === 'Tab') { e.preventDefault(); __CMDP.active = Math.min(__CMDP.active + 1, (__CMDP.filtered.length - 1)); highlightActiveCommand(); return; }
    });
  }

  // Close palette on theme change re-render etc: safe, no-op.

  // Context menu for select multi-ops
  const grid = document.getElementById('cards-grid');
  if (grid) {
    grid.addEventListener('contextmenu', (e)=>{
      if (state.selectMode && (state.selectedIds||[]).length) showSelectCtxMenu(e);
    });
  }
}

// Extend Escape handler: if palette open, close it first
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape' && __CMDP.open) { e.preventDefault(); closeCommandPalette(); }
}, true);

// Run bind after init
setTimeout(()=>{ try{ bindV97(); } catch(e){ console.error(e); } }, 0);

// ===== Dock Panel Functions =====
function toggleDock() {
    FX.dockVisible = !FX.dockVisible;
    saveData();
    renderDock();
    renderSettings();
}

function renderDock() {
    const container = document.getElementById('dock-container');
    const dock = document.getElementById('dock-panel');
    if (!container || !dock) return;
    
    // v126: Поддержка трёх режимов dock
    const dockMode = FX.dockMode || 'always';
    dock.dataset.dockMode = dockMode;
    
    // Показать/скрыть dock в зависимости от режима
    if (dockMode === 'off') {
        dock.classList.remove('visible');
    } else if (dockMode === 'hover') {
        dock.classList.add('visible');
    } else {
        dock.classList.add('visible');
    }
    
    // Получить избранные сайты
    const starred = DATA.sites.filter(s => s.starred);
    
    if (starred.length === 0) {
        container.innerHTML = `<div class="dock-empty"><i class="fas fa-star"></i>Нет избранных сайтов<br><small>Нажмите ★ на карточке сайта</small></div>`;
        return;
    }
    
    container.innerHTML = starred.map(site => {
        const bgColor = site.bg || '#6366f1';
        const iconClass = site.icon || 'fas fa-globe';
        
        return `
            <div class="dock-item" data-site-id="${site.id}">
                <div class="dock-item-icon" style="background: ${bgColor}" onclick="openSite('${escapeHtml(site.url)}')">
                    ${site.customIcon 
                        ? `<img src="${site.customIcon}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><i class="${iconClass}" style="display:none"></i>`
                        : `<i class="${iconClass}"></i>`
                    }
                </div>
                <button class="dock-item-remove" onclick="event.stopPropagation();removeDockItem(${site.id})" title="Удалить из избранного">
                    <i class="fas fa-times"></i>
                </button>
                <div class="dock-item-tooltip">${escapeHtml(site.name)}</div>
            </div>
        `;
    }).join('');
    
    // v121: Добавление Sortable для перемещения иконок dock
    initDockSortable();
}

// v121: Sortable для Dock
function initDockSortable() {
    if (!window.Sortable) return;
    const container = document.getElementById('dock-container');
    if (!container || container._sortableInit) return;
    
    new Sortable(container, {
        animation: 200,
        ghostClass: 'dock-item-ghost',
        onEnd: () => {
            const newOrder = [];
            container.querySelectorAll('.dock-item').forEach(el => {
                const id = parseInt(el.dataset.siteId);
                if (id) newOrder.push(id);
            });
            // Сохранить порядок в DATA.dockOrder
            DATA.dockOrder = newOrder;
            saveData();
            showToast('Порядок Dock сохранён');
        }
    });
    container._sortableInit = true;
}

function removeDockItem(id) {
    const site = DATA.sites.find(s => s.id === id);
    if (site) {
        site.starred = false;
        saveData();
        renderDock();
        renderContent();
        showToast(`${site.name} удалён из избранного`);
    }
}

function openSite(url) {
    if (url) window.open(url, '_blank');
}

init();
applyNavPanelState();
</script>
